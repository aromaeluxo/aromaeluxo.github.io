<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eff0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Marília ADM">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Marília Aroma e Luxo · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eff0;--p1:#fff;--p2:#faf7f8;--line:#e3d9dd;--wine:#6b2340;--wine2:#8a3354;--rose:#e9d3db;--txt:#2a1f24;--muted:#857880;--ok:#3f8f63;--warn:#b7791f;--err:#b83c3c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Figtree',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.hide{display:none!important}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#login form{width:100%;max-width:340px}
#login h1{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:500;font-size:3rem;color:var(--wine);margin-bottom:22px;text-align:center}
#app{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 86px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top h2{font-family:'Bodoni Moda',serif;font-weight:500;font-size:1.9rem;color:var(--wine)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;color:var(--muted);font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button.on{color:var(--wine)}
nav .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--err);color:#fff;font-size:.65rem;border-radius:9px;padding:0 5px;min-width:16px}
@media(min-width:900px){#app{max-width:1100px;margin:0 auto}}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--wine);color:#fff;font-weight:600;cursor:pointer}
.btn.sm{padding:7px 13px;font-size:.85rem}
.btn.ghost{background:var(--p1);color:var(--txt);border:1px solid var(--line)}
.btn.red{background:transparent;color:var(--err);border:1px solid rgba(184,60,60,.35)}
.btn.green{background:var(--ok);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--wine)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--muted);font-size:.78rem}
.kpi b{display:block;font-size:1.3rem;font-weight:600;margin-top:2px}
.kpi.hero{grid-column:span 2;background:var(--wine);border-color:var(--wine);color:#fff}
.kpi.hero small{color:var(--rose)}
.kpi.hero b{font-family:'Bodoni Moda',serif;font-size:2.3rem;font-weight:500}
.pos{color:var(--ok)}.neg{color:var(--err)}.wrn{color:var(--warn)}
h3.sec{font-size:.95rem;font-weight:600;color:var(--wine);margin:22px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}
.item .th{width:56px;height:56px;border-radius:10px;background:var(--rose) center/cover;flex:none}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.item .r{text-align:right;flex:none}
.pill{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:9px;border:1px solid currentColor}
.pill.encomenda{color:var(--wine2)}.pill.disponivel{color:var(--ok)}.pill.reservado{color:var(--warn)}.pill.vendido{color:var(--muted)}
.seg{display:flex;background:var(--rose);border-radius:999px;padding:3px;margin-bottom:14px}
.seg button{flex:1;background:none;border:0;padding:8px;border-radius:999px;color:var(--wine);font-size:.85rem}
.seg button.on{background:var(--p1);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:.9rem}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:56px;height:56px;border-radius:50%;background:var(--wine);color:#fff;border:0;font-size:1.8rem;box-shadow:0 8px 22px rgba(107,35,64,.35);z-index:15}
.ov{position:fixed;inset:0;background:rgba(42,31,36,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--p1);width:100%;max-width:620px;max-height:94dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet h4{font-family:'Bodoni Moda',serif;font-size:1.6rem;font-weight:500;color:var(--wine);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.sheet h4 button{background:none;border:0;color:var(--muted);font-size:1.3rem}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.photos .p{width:86px;height:86px;border-radius:10px;background:var(--rose) center/cover;position:relative}
.photos .p button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--err);color:#fff;font-size:.75rem}
.photos label.add{width:86px;height:86px;border-radius:10px;border:1.5px dashed var(--wine2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--wine);font-size:.75rem;gap:4px;cursor:pointer}
.photos label.add svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
.chk{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--p2)}
.chk input{width:20px;height:20px;accent-color:var(--wine)}
.chk .th{width:36px;height:36px;border-radius:6px;background:var(--rose) center/cover;flex:none}
.parc{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.parc input{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0;font-size:15px}
.parc .n{color:var(--muted);font-size:.85rem}
.parc .pay{grid-column:2/4;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vcard{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.vcard .hd{display:flex;justify-content:space-between;gap:10px}
.vth{display:flex;gap:4px;margin-top:8px}.vth span{width:34px;height:34px;border-radius:6px;background:var(--rose) center/cover}
.bar{height:5px;background:var(--rose);border-radius:3px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--wine)}
.pl{display:flex;justify-content:space-between;align-items:center;font-size:.83rem;padding:6px 0;border-top:1px solid var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);background:var(--txt);color:#fff;padding:10px 18px;border-radius:20px;font-weight:500;z-index:60;font-size:.9rem}
.tot{display:flex;justify-content:space-between;padding:10px 0;font-size:.95rem}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--p1);border-radius:999px;padding:7px 14px;font-size:.84rem;color:var(--muted)}
.chips button.on{background:var(--wine);border-color:var(--wine);color:#fff}
.sjb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--p1);border:1px solid var(--line);border-left:3px solid var(--wine);border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.sjb b{display:block;font-weight:600;color:var(--wine)}.sjb small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}.sjb>span:last-child{color:var(--muted);font-size:1.4rem}
.vitens{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.vitens>div{display:flex;align-items:center;gap:8px;font-size:.82rem}
.vitens>div>span:nth-child(2){flex:1;min-width:0}
.vitens .mini{width:28px;height:28px;border-radius:6px;background:var(--rose) center/cover;flex:none}
body.discreto .priv{color:transparent!important;background:var(--rose);border-radius:5px;user-select:none;-webkit-user-select:none}
.kpi.hero .priv{border-radius:7px}
.eye{padding:7px 10px}.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;display:block}
.eye .slash{display:none}body.discreto .eye .slash{display:inline}
.cbox{position:relative}
.csr{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--p1);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(42,31,36,.15);z-index:5;overflow:hidden}
.csr button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 12px;font-size:.92rem}
.csr button:last-child{border-bottom:0}.csr button span{color:var(--muted);font-size:.82rem;flex:none}
.csr button.novo{color:var(--wine);justify-content:flex-start;gap:4px}
.danger{border:1px solid rgba(184,60,60,.3);border-radius:14px;padding:14px;background:#fff}
.danger p{color:var(--muted);font-size:.86rem;line-height:1.55;margin-bottom:10px}
</style>
</head>
<body class="discreto">

<section id="login" class="hide">
  <form id="lf">
    <h1>Marília<small style="display:block;font-family:Figtree,sans-serif;font-style:normal;font-size:.8rem;letter-spacing:.38em;text-transform:uppercase;color:var(--txt);margin-top:8px">Aroma e Luxo · Admin</small></h1>
    <div class="fld"><label>E-mail</label><input id="le" type="email" autocomplete="username" required></div>
    <div class="fld"><label>Senha</label><input id="lp" type="password" autocomplete="current-password" required></div>
    <button class="btn block">Entrar</button>
    <p id="lerr" class="neg" style="margin-top:12px;font-size:.85rem;text-align:center"></p>
  </form>
</section>

<section id="app" class="hide">
  <div class="top"><h2 id="ttl">Resumo</h2><div style="display:flex;gap:8px"><button class="btn ghost sm eye" id="eye" aria-label="Mostrar lucro e custo" title="Mostrar lucro e custo"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M3 3l18 18"/></svg></button><button class="btn ghost sm" id="out">Sair</button></div></div>
  <div id="view"></div>
</section>

<button class="fab hide" id="fab" aria-label="Adicionar">+</button>

<nav id="nav" class="hide">
  <button data-t="resumo" class="on"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumo</button>
  <button data-t="produtos"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/></svg>Produtos</button>
  <button data-t="reservas"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Reservas<span class="badge hide" id="bdg"></span></button>
  <button data-t="vendas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/></svg>Vendas</button>
  <button data-t="config"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-2.9-1.2l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 15H3a2 2 0 110-4h.1a1.7 1.7 0 001.2-2.9l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 009 4.6V4.5a2 2 0 114 0v.1a1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 001.2 2.9h.1a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Ajustes</button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, onSnapshot, writeBatch, setDoc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// >>> MESMA CONFIG DO index.html
const firebaseConfig = {
  apiKey: "AIzaSyAosvL5iqvBKiigtPZ7SmtRFvZoApBvyHk",
  authDomain: "marilia-loja.firebaseapp.com",
  projectId: "marilia-loja",
  storageBucket: "marilia-loja.firebasestorage.app",
  messagingSenderId: "177612077044",
  appId: "1:177612077044:web:c7993a1d7219c6ccf46ba1"
};
const ADMIN_UIDS = ["YIA9hIVIs0bJWAMvp8LsMPyDUsy1", "KJ9qu8kZTpejzHi3jzI5DERERMG3"];   // Authentication > Users. Pode ter 1 ou 2 (você e a Marília)

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app,{localCache:persistentLocalCache()});
setPersistence(auth,browserLocalPersistence);

const $=s=>document.querySelector(s);
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fdate=s=>s?s.split('-').reverse().join('/'):'—';
const addMonths=(s,n)=>{const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1+n,1);const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();dt.setDate(Math.min(d,last));return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`};
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;let t=String(v??'').trim().replace(/[^\d,.-]/g,'');
  if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');return parseFloat(t)||0;};
const LOTES={'Semijoias':{key:'semijoias',subs:['Correntes','Pingentes','Pulseiras','Anéis','Brincos','Conjuntos'],forn:'Missara'},
  'Roupa Íntima':{key:'roupaintima',subs:['Conjuntos','Calcinhas','Sutiãs','Meias','Cuecas','Pijamas'],forn:'Justen'}};
const LOTE_CATS=Object.keys(LOTES), isLote=c=>!!LOTES[c];
const CATS=['Semijoias','Roupa Íntima','Fitness','Casual','Perfumes e Cosméticos','Utilidades','Eletrônicos'];
const VEST=['Roupa Íntima','Fitness','Casual'], isVest=c=>VEST.includes(c);
const catOptions=sel=>CATS.filter(c=>!isVest(c)).slice(0,1).map(c=>`<option ${sel===c?'selected':''}>${c}</option>`).join('')
  +`<optgroup label="Vestuário">${VEST.map(c=>`<option ${sel===c?'selected':''}>${c}</option>`).join('')}</optgroup>`
  +CATS.filter(c=>!isVest(c)).slice(1).map(c=>`<option ${sel===c?'selected':''}>${c}</option>`).join('');
const diasAte=s=>Math.round((new Date(s+'T12:00')-new Date(today()+'T12:00'))/864e5);
const fmtW=w=>{const d=String(w||'').replace(/\D/g,'');return d.length>=10?`(${d.slice(0,2)}) ${d.slice(2,-4)}-${d.slice(-4)}`:d};
const r2=v=>Math.round(v*100)/100;
const lc=cat=>{const x=LC[cat]||{};return {numero:1,acerto:'',comissao:30,historico:[],...x,fornecedor:x.fornecedor||LOTES[cat].forn};};
const menos1=s=>{if(!s)return '';const [y,m,d]=s.split('-').map(Number),dt=new Date(y,m-1,d-1);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;};
const dlCSV=(L,nome)=>{const csv='\ufeff'+L.map(r=>r.map(c=>typeof c==='number'?String(r2(c)).replace('.',','):`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=nome;a.click();};
const wa=(w,t='')=>`https://wa.me/55${String(w).replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'')}${t?'?text='+encodeURIComponent(t):''}`;
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const uid=()=>doc(collection(db,'x')).id;

let P=[], PRIV={}, R=[], V=[], CFG={}, tab='resumo', mes=today().slice(0,7), pFiltro='disponivel', vFiltro='abertas';
let unsubs=[], LC={}, FORN=['Tati','Brandon','Missara','Justen'], C={}, cLoaded=false, clientesSync=new Set(), pCat='', pBusca='';

// ---------- auth ----------
onAuthStateChanged(auth,u=>{
  if(u && ADMIN_UIDS.includes(u.uid)){ $('#login').classList.add('hide'); ['#app','#nav'].forEach(s=>$(s).classList.remove('hide')); listen(); }
  else{ if(u) signOut(auth); unsubs.forEach(f=>f()); unsubs=[]; $('#login').classList.remove('hide'); ['#app','#nav','#fab'].forEach(s=>$(s).classList.add('hide')); }
});
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lerr').textContent='';
  try{ const c=await signInWithEmailAndPassword(auth,$('#le').value,$('#lp').value); if(!ADMIN_UIDS.includes(c.user.uid)) $('#lerr').textContent='Esta conta não tem acesso ao painel.'; }
  catch(err){ $('#lerr').textContent='E-mail ou senha incorretos.'; } };
$('#out').onclick=()=>signOut(auth);
const setDiscreto=on=>{document.body.classList.toggle('discreto',on);$('#eye').setAttribute('aria-pressed',String(!on));};
$('#eye').onclick=()=>setDiscreto(!document.body.classList.contains('discreto'));

function listen(){
  unsubs.push(onSnapshot(collection(db,'produtos'),s=>{P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.criadoEm?.seconds||9e9)-(a.criadoEm?.seconds||9e9));render();}));
  unsubs.push(onSnapshot(collection(db,'produtos_priv'),s=>{PRIV={};s.docs.forEach(d=>PRIV[d.id]=d.data());render();}));
  unsubs.push(onSnapshot(collection(db,'reservas'),s=>{R=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.criadoEm?.seconds||9e9)-(a.criadoEm?.seconds||9e9));
    const n=R.filter(r=>r.status==='pendente').length;$('#bdg').textContent=n;$('#bdg').classList.toggle('hide',!n);syncClientes();render();}));
  unsubs.push(onSnapshot(collection(db,'vendas'),s=>{V=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.data||'').localeCompare(a.data||''));syncClientes();render();}));
  LOTE_CATS.forEach(cat=>unsubs.push(onSnapshot(doc(db,'admin_config',LOTES[cat].key),d=>{LC[cat]=d.exists()?d.data():{};render();})));

    <div class="kpis">

      <div class="kpi"><small>Vendido no mês</small><b>${brl(fat)}</b></div>
      <div class="kpi"><small>Recebido no mês</small><b class="pos">${brl(receb)}</b></div>
      <div class="kpi"><small>Lucro bruto das vendas</small><b class="priv">${brl(lucroBruto)}</b><small class="priv">${fat?Math.round(lucroBruto/fat*100):0}% de margem</small></div>
      <div class="kpi"><small>A receber (total)</small><b class="wrn">${brl(aReceber)}</b></div>
      <div class="kpi"><small>Custo em estoque</small><b class="priv">${brl(estoque)}</b></div>
      <div class="kpi"><small>Vendas no mês</small><b>${vm.length}</b></div>
    </div>
    <h3 class="sec">Desde o início</h3>

      <div class="kpi"><small>Total vendido</small><b>${brl(fatTot)}</b><small>${V.length} vendas</small></div>
      <div class="kpi"><small>Total recebido</small><b class="pos">${brl(recebTot)}</b></div>
      <div class="kpi"><small>Lucro realizado</small><b class="priv">${brl(lucroRealTot)}</b></div>

function compress(file,max,q){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q));};
  img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u;});}
function thumbFrom(dataUrl){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=360,c=document.createElement('canvas');c.width=c.height=s;
  const m=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',.7));};img.src=dataUrl;});}

        ${p&&p.status==='disponivel'&&!enc?`<button class="btn ghost sm" data-a="hold" data-id="${r.id}">Segurar item</button>`:''}
        <button class="btn green sm" data-a="sell" data-id="${r.id}">Virar venda</button>
        <button class="btn red sm" data-a="cancel" data-id="${r.id}">Cancelar</button></div>`:''}</div>`};
  $('#view').innerHTML=`<div class="list">${pend.map(card).join('')||'<div class="empty">Nenhuma reserva pendente.</div>'}</div>
    ${hist.length?`<h3 class="sec">Histórico</h3>${hist.map(card).join('')}`:''}`;
  $('#view').querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    const r=R.find(x=>x.id===b.dataset.id);
    if(b.dataset.a==='hold'){await updateDoc(doc(db,'produtos',r.produtoId),{status:'reservado'});toast('Item marcado como reservado');}
    if(b.dataset.a==='sell') formVenda(null,r);
    if(b.dataset.a==='cancel'){if(!confirm('Cancelar este pedido?'))return;const bt=writeBatch(db);bt.update(doc(db,'reservas',r.id),{status:'cancelada'});
      const outras=R.some(x=>x.id!==r.id&&x.produtoId===r.produtoId&&x.status==='pendente');const p=P.find(x=>x.id===r.produtoId);
      if(p&&p.status==='reservado'&&!outras) bt.update(doc(db,'produtos',p.id),{status:'disponivel'});
      await bt.commit();toast('Pedido cancelado');}
  });
}

// ---------- VENDAS ----------
const itemTxt=i=>`${esc(i.nome)}${i.fornecedor?` <span style="color:var(--wine2)">· ${esc(i.fornecedor)}</span>`:''}`;

    ${list.map(v=>{const pg=pago(v),pc=v.valorTotal?Math.min(100,pg/v.valorTotal*100):0;const hj=today();

        <div style="text-align:right;flex:none"><div style="font-weight:500">${brl(v.valorTotal)}</div><div class="pos" style="font-size:.78rem">lucro <span class="priv">${brl(v.valorTotal-(v.custoTotal||0))}</span></div></div></div>
        <div class="vitens">${(v.itens||[]).map(i=>`<div><span class="mini" style="background-image:url('${i.thumb||''}')"></span><span>${itemTxt(i)}</span><span>${brl(i.preco)}</span></div>`).join('')}</div>
        <div class="bar"><i style="width:${pc}%"></i></div><div style="font-size:.78rem;color:var(--muted)">Pago ${brl(pg)} de ${brl(v.valorTotal)}</div>
        ${(v.parcelas||[]).map((p,i)=>`<div class="pl"><span>${p.n}/${v.parcelas.length} · ${fdate(p.vencimento)} · ${brl(p.valor)}</span>
          ${p.pagoEm?`<span class="pos">pago ${fdate(p.pagoEm)}</span>`:`<button class="btn ${p.vencimento<hj?'red':'ghost'} sm" data-pay="${v.id}" data-i="${i}">${p.vencimento<hj?'Atrasada · Receber':'Receber'}</button>`}</div>`).join('')}
        <div class="acts"><a class="btn ghost sm" target="_blank" style="text-decoration:none" href="${wa(v.clienteWhats)}">WhatsApp</a><button class="btn ghost sm" data-ed="${v.id}">Editar</button></div></div>`}).join('')||'<div class="empty">Nenhuma venda aqui. Toque em + para registrar.</div>'}`;
  $('#view').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{vFiltro=b.dataset.f;render();});
  $('#view').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>formVenda(b.dataset.ed));
  $('#view').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>receber(b.dataset.pay,+b.dataset.i));
}

  const v=V.find(x=>x.id===vid),p=v.parcelas[i];
  open(`<h4>Receber parcela ${p.n}<button data-x>✕</button></h4>
    <p style="color:var(--muted);margin-bottom:14px">${esc(v.clienteNome)} · vence ${fdate(p.vencimento)}</p>
    <div class="row"><div class="fld"><label>Valor pago</label><input id="rv" inputmode="decimal" value="${String(p.valor).replace('.',',')}"></div>
    <div class="fld"><label>Data do pagamento</label><input id="rd" type="date" value="${today()}"></div></div>
    <button class="btn green block" id="rok">Confirmar recebimento</button>`);
  $('#rok').onclick=async()=>{const parcelas=v.parcelas.map((x,j)=>j===i?{...x,valorPago:num($('#rv').value),pagoEm:$('#rd').value}:x);
    await updateDoc(doc(db,'vendas',vid),{parcelas});close();toast('Pagamento registrado');};

const emOutraVenda=(pid,vid)=>V.some(x=>x.id!==vid&&(x.itens||[]).some(i=>i.produtoId===pid));
function formVenda(id,reserva){
  const v=id?structuredClone(V.find(x=>x.id===id)):{data:today(),clienteNome:reserva?.clienteNome||'',clienteWhats:reserva?.clienteWhats||'',itens:[],parcelas:[],obs:''};
  if(reserva){const p=P.find(x=>x.id===reserva.produtoId);if(p) v.itens=[snapItem(p)];}
  const disp=P.filter(p=>p.status!=='vendido'||v.itens.some(i=>i.produtoId===p.id))
    .concat(v.itens.filter(i=>!P.some(p=>p.id===i.produtoId)).map(i=>({id:i.produtoId,nome:i.nome+' (catálogo antigo)',preco:i.preco,thumb:i.thumb,orfao:1})));
  const fv=p=>p.orfao?(v.itens.find(i=>i.produtoId===p.id)?.fornecedor||''):fornDe(p);
  let totalManual=id?v.valorTotal:null;
  open(`<h4>${id?'Editar venda':'Nova venda'}<button data-x>✕</button></h4>
    <div class="fld cbox"><label>Cliente</label><input id="vn" value="${esc(v.clienteNome)}" autocomplete="off" placeholder="Buscar por nome ou WhatsApp"><div class="csr hide" id="vnr"></div>
      <p id="vnh" class="hide" style="color:var(--wine);font-size:.78rem;margin-top:6px">Nova cliente: informe o WhatsApp para ela entrar no cadastro.</p></div>
    <div class="row"><div class="fld"><label>WhatsApp</label><input id="vw" inputmode="tel" value="${esc(v.clienteWhats)}"></div>
      <div class="fld"><label>Data da venda</label><input id="vd" type="date" value="${v.data}"></div></div>
    <label style="font-size:.8rem;color:var(--muted);display:block;margin-bottom:6px">Produtos <span id="vcnt"></span></label>
    <div class="chips" id="vcat">${['','*',...CATS.filter(c=>disp.some(p=>p.categoria===c))].map(c=>`<button type="button" data-c="${esc(c)}" class="${c===''?'on':''}">${c===''?'Todas':c==='*'?'Selecionados':esc(c)}</button>`).join('')}</div>
    <div class="fld" style="margin-bottom:8px"><input id="vq" type="search" placeholder="Buscar produto"></div>
    <div id="vi" style="max-height:300px;overflow:auto;margin-bottom:8px">${disp.map(p=>`<label class="chk" data-cat="${esc(p.categoria||'')}" data-q="${esc((p.nome+' '+(p.subcategoria||'')+' '+fv(p)).toLowerCase())}"><input type="checkbox" value="${p.id}" ${v.itens.some(i=>i.produtoId===p.id)?'checked':''}>
      <span class="th" style="background-image:url('${p.thumb||''}')"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.nome)}<small style="display:block;color:var(--muted);font-size:.74rem">${esc(fv(p))}${p.status==='encomenda'?' · sob encomenda':''}</small></span><span>${brl(p.preco)}</span></label>`).join('')||'<div class="empty">Nenhum produto disponível.</div>'}</div>
    <div class="tot"><span style="color:var(--muted)">Soma dos itens</span><span id="vsum"></span></div>
    <div class="row"><div class="fld"><label>Valor final (c/ desconto)</label><input id="vt" inputmode="decimal"></div>
      <div class="fld"><label>Parcelas</label><select id="vp">${Array.from({length:12},(_,i)=>`<option ${v.parcelas.length===i+1?'selected':''}>${i+1}</option>`).join('')}</select></div></div>
    <div class="fld"><label>1º vencimento</label><input id="v1" type="date" value="${v.parcelas[0]?.vencimento||today()}"></div>
    <div id="vparc"></div>
    <div class="fld" style="margin-top:12px"><label>Observação</label><input id="vo" value="${esc(v.obs||'')}"></div>
    <div class="tot"><span style="color:var(--muted)">Lucro previsto</span><b id="vl" class="pos priv"></b></div>
    <button class="btn block" id="vsave">${id?'Salvar venda':'Registrar venda'}</button>
    ${id?'<button class="btn red block" id="vdel" style="margin-top:10px">Excluir venda</button>':''}`);

  let novaCli=false;
  const cliRes=()=>{const q=$('#vn').value.trim(),ql=q.toLowerCase(),qd=q.replace(/\D/g,'');
    if(q.length<2){$('#vnr').classList.add('hide');return;}
    const hits=Object.values(C).filter(c=>(c.nome||'').toLowerCase().includes(ql)||(qd.length>=3&&c.whats.includes(qd))).slice(0,6);
    const exato=hits.some(c=>(c.nome||'').toLowerCase()===ql);
    $('#vnr').innerHTML=hits.map(c=>`<button type="button" data-w="${c.whats}"><b>${esc(c.nome)}</b><span>${fmtW(c.whats)}</span></button>`).join('')
      +(exato?'':`<button type="button" class="novo" data-novo="1">+ Incluir nova cliente: <b>${esc(q)}</b></button>`);
    $('#vnr').classList.remove('hide');
    $('#vnr').querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault();
      if(b.dataset.novo){novaCli=true;
        if(qd.length>=8&&qd.length===q.replace(/[\s()+-]/g,'').length){$('#vw').value=qd;$('#vn').value='';$('#vn').focus();}
        else{$('#vn').value=q.replace(/\b\p{L}/gu,m=>m.toUpperCase());$('#vw').value='';$('#vw').focus();}
        $('#vnh').classList.remove('hide');}
      else{const c=C[b.dataset.w];novaCli=false;$('#vn').value=c.nome;$('#vw').value=c.whats;$('#vnh').classList.add('hide');}
      $('#vnr').classList.add('hide');});};
  $('#vn').oninput=cliRes; $('#vn').onfocus=cliRes; $('#vn').onblur=()=>setTimeout(()=>$('#vnr').classList.add('hide'),150);
  $('#vw').onchange=()=>{const c=C[$('#vw').value.replace(/\D/g,'')];if(c&&!$('#vn').value.trim())$('#vn').value=c.nome;};
  let vCat='';
  const filtraVi=()=>{const q=$('#vq').value.trim().toLowerCase();let n=0;
    $('#vi').querySelectorAll('label.chk').forEach(l=>{const ck=l.querySelector('input').checked;if(ck)n++;
      const ok=(vCat===''||(vCat==='*'?ck:l.dataset.cat===vCat))&&(!q||l.dataset.q.includes(q));l.style.display=ok?'':'none';});
    $('#vcnt').textContent=n?`· ${n} selecionado${n===1?'':'s'}`:'';};
  $('#vcat').querySelectorAll('button').forEach(b=>b.onclick=()=>{vCat=b.dataset.c;$('#vcat').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));filtraVi();});
  $('#vq').oninput=filtraVi;
  const itensSel=()=>[...$('#vi').querySelectorAll('input:checked')].map(c=>{const old=v.itens.find(i=>i.produtoId===c.value);if(old)return old;return snapItem(P.find(x=>x.id===c.value));});
  const regen=keep=>{const n=+$('#vp').value,tot=num($('#vt').value),first=$('#v1').value||today();
    const base=Math.floor(tot/n*100)/100,resto=Math.round((tot-base*n)*100)/100;
    const old=v.parcelas||[];
    v.parcelas=Array.from({length:n},(_,i)=>{const o=old[i]||{};return {n:i+1,vencimento:o.vencimento&&keep?o.vencimento:addMonths(first,i),valor:o.valor!=null&&keep?o.valor:Math.round((i===0?base+resto:base)*100)/100,pagoEm:o.pagoEm||'',valorPago:o.valorPago||0};});
    drawParc();};
  const drawParc=()=>{$('#vparc').innerHTML=v.parcelas.map((p,i)=>`<div class="parc"><span class="n">${p.n}ª</span>
      <input type="date" data-k="vencimento" data-i="${i}" value="${p.vencimento}"><input inputmode="decimal" data-k="valor" data-i="${i}" value="${String(p.valor).replace('.',',')}">
      <div class="pay"><input type="date" data-k="pagoEm" data-i="${i}" value="${p.pagoEm||''}" aria-label="Data do pagamento"><input inputmode="decimal" data-k="valorPago" data-i="${i}" placeholder="valor pago" value="${p.pagoEm?String(p.valorPago).replace('.',','):''}"></div></div>`).join('')
      +`<p style="font-size:.75rem;color:var(--muted);margin-top:6px">Linha de baixo de cada parcela: data e valor pagos. Deixe vazio se ainda não pagou.</p>`;
    $('#vparc').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{const k=inp.dataset.k,i=+inp.dataset.i;v.parcelas[i][k]=(k==='valor'||k==='valorPago')?num(inp.value):inp.value;
      if(k==='pagoEm'&&inp.value&&!v.parcelas[i].valorPago){v.parcelas[i].valorPago=v.parcelas[i].valor;drawParc();}});};
  const recalc=(resetTotal)=>{const it=itensSel(),s=it.reduce((a,i)=>a+i.preco,0),c=it.reduce((a,i)=>a+i.custo,0);
    $('#vsum').textContent=brl(s);if(resetTotal||totalManual==null) $('#vt').value=s.toFixed(2).replace('.',',');
    $('#vl').textContent=brl(num($('#vt').value)-c);};
  $('#vi').querySelectorAll('input').forEach(c=>c.onchange=()=>{filtraVi();totalManual=null;recalc(true);regen(false);});
  $('#vt').oninput=()=>{totalManual=1;recalc();};$('#vt').onchange=()=>regen(false);
  $('#vp').onchange=()=>regen(false);$('#v1').onchange=()=>regen(false);
  filtraVi(); recalc(!id); if(id){$('#vt').value=String(v.valorTotal).replace('.',',');recalc();drawParc();} else regen(false);

  $('#vsave').onclick=async()=>{
    const itens=itensSel(),nome=$('#vn').value.trim(),tot=num($('#vt').value);
    if(!nome) return alert('Informe o nome do cliente.');
    if(!itens.length) return alert('Selecione pelo menos um produto.');
    if($('#vw').value.replace(/\D/g,'').length<10&&!confirm('Sem WhatsApp válido a cliente não entra no cadastro e não dá para cobrar pelo painel. Registrar a venda mesmo assim?')) return;
    const soma=Math.round(v.parcelas.reduce((a,p)=>a+num(p.valor),0)*100)/100;
    if(Math.abs(soma-tot)>0.02&&!confirm(`A soma das parcelas (${brl(soma)}) é diferente do valor final (${brl(tot)}). Salvar mesmo assim?`)) return;
    const vid=id||uid(),b=writeBatch(db);
    const data={clienteNome:nome,clienteWhats:$('#vw').value.replace(/\D/g,''),data:$('#vd').value||today(),itens,valorTotal:tot,custoTotal:itens.reduce((a,i)=>a+i.custo,0),
      parcelas:v.parcelas.map(p=>({...p,valor:num(p.valor),valorPago:p.pagoEm?num(p.valorPago):0})),obs:$('#vo').value.trim(),atualizadoEm:serverTimestamp()};
    if(!id){data.criadoEm=serverTimestamp(); if(reserva) data.reservaId=reserva.id;}
    b.set(doc(db,'vendas',vid),data,{merge:true});
    // lote (semijoias, roupa íntima): vendido. Demais: continua na loja como "sob encomenda"
    itens.forEach(i=>{const p=P.find(x=>x.id===i.produtoId); if(p) b.update(doc(db,'produtos',p.id),{status:isLote(p.categoria)?'vendido':'encomenda'});});
    if(id){const removidos=(V.find(x=>x.id===id).itens||[]).filter(o=>!itens.some(i=>i.produtoId===o.produtoId));
      removidos.forEach(o=>{if(P.some(p=>p.id===o.produtoId)&&!emOutraVenda(o.produtoId,id)) b.update(doc(db,'produtos',o.produtoId),{status:'disponivel'});});}
    if(reserva) b.update(doc(db,'reservas',reserva.id),{status:'convertida'});
    if(data.clienteWhats.length>=10) b.set(doc(db,'clientes',data.clienteWhats),{nome,whats:data.clienteWhats,atualizadoEm:serverTimestamp()},{merge:true});
    $('#vsave').disabled=true;
    try{await b.commit();close();toast(id?'Venda salva':'Venda registrada');}catch(e){console.error(e);alert('Erro ao salvar: '+e.message);$('#vsave').disabled=false;}
  };
  if(id) $('#vdel').onclick=async()=>{if(!confirm('Excluir esta venda? Os produtos voltam para disponível.'))return;
    const b=writeBatch(db);b.delete(doc(db,'vendas',id));(v.itens||[]).forEach(i=>{if(P.some(p=>p.id===i.produtoId)&&!emOutraVenda(i.produtoId,id)) b.update(doc(db,'produtos',i.produtoId),{status:'disponivel'});});
    await b.commit();close();toast('Venda excluída');};
}

  $('#csave').onclick=async()=>{const nt=$('#cnt').value.trim();if(nt&&!/^[\w-]{8,64}$/.test(nt))return alert('O código só pode ter letras, números e hífen (8 a 64).');

// itens vendidos com valor efetivo (desconto rateado) e quanto já foi recebido de cada um
function itensVendidos(filtro){
  const out=[];
  V.forEach(v=>{const soma=(v.itens||[]).reduce((a,i)=>a+num(i.preco),0)||1, ratio=v.valorTotal/soma, fPago=v.valorTotal>0?pago(v)/v.valorTotal:0;
    (v.itens||[]).forEach((i,idx)=>{if(filtro(i)){const efetivo=num(i.preco)*ratio;out.push({v,i,idx,efetivo,recebido:efetivo*fPago});}});});
  return out;
}
function dadosAcerto(cat,n){
  const vendidos=itensVendidos(i=>i.consignado&&(i.categoria||'Semijoias')===cat&&i.catalogo===n);
  const devolver=P.filter(p=>p.categoria===cat&&(p.catalogo||n)===n&&p.status!=='vendido');
  const etiqueta=vendidos.reduce((a,x)=>a+num(x.i.preco),0), repasse=vendidos.reduce((a,x)=>a+num(x.i.custo),0);
  const efetivo=vendidos.reduce((a,x)=>a+x.efetivo,0), recebido=vendidos.reduce((a,x)=>a+x.recebido,0);
  return {cat,n,vendidos,devolver,etiqueta,repasse,comissao:efetivo-repasse,recebido,falta:efetivo-recebido,
    reservados:devolver.filter(p=>p.status==='reservado').length,valorDevolver:devolver.reduce((a,p)=>a+num(p.preco),0)};
}
function relatorioAcerto(cat){
  const L=lc(cat), A=dadosAcerto(cat,L.numero), gap=Math.max(0,A.repasse-A.recebido);
  open(`<h4>Acerto · ${esc(cat)} lote ${A.n}<button data-x>✕</button></h4>
    <p style="color:var(--muted);margin:-8px 0 14px">${esc(L.fornecedor)} · ${L.acerto?`acerto em ${fdate(L.acerto)}`:'sem data definida'}</p>
    <div class="kpis">
      <div class="kpi hero"><small>Repassar a ${esc(L.fornecedor)}</small><b>${brl(A.repasse)}</b><small>${A.vendidos.length} peça${A.vendidos.length===1?'':'s'} vendida${A.vendidos.length===1?'':'s'} · ${brl(A.etiqueta)} em etiqueta</small></div>
      <div class="kpi"><small>Sua comissão (após descontos)</small><b class="${A.comissao<0?'neg':'pos'}">${brl(A.comissao)}</b></div>
      <div class="kpi"><small>Já recebido das clientes</small><b>${brl(A.recebido)}</b></div>
      <div class="kpi"><small>Clientes ainda devem</small><b class="wrn">${brl(A.falta)}</b></div>
      <div class="kpi"><small>Devolver</small><b>${A.devolver.length} peças</b><small>${brl(A.valorDevolver)} em etiqueta</small></div>
    </div>
    ${gap>0.01?`<div class="danger" style="margin-bottom:12px"><p style="margin:0">Se acertar hoje, <b>${brl(gap)}</b> do repasse sai do seu caixa: as clientes ainda não pagaram essas parcelas.</p></div>`:''}
    ${A.reservados?`<div class="danger" style="margin-bottom:12px"><p style="margin:0">${A.reservados} peça${A.reservados===1?' está reservada':'s estão reservadas'}. Venda ou libere antes do acerto.</p></div>`:''}
    <h3 class="sec">Vendidas</h3>
    <div class="list">${A.vendidos.map(({v,i})=>`<div class="item"><div class="th" style="background-image:url('${i.thumb||''}')"></div>
      <div class="mid"><div class="t">${esc(i.nome)}</div><div class="s">${esc(i.subcategoria||'')} · ${esc(v.clienteNome)} · ${fdate(v.data)}</div></div>
      <div class="r"><div style="font-weight:500">${brl(i.preco)}</div><div class="s">repasse ${brl(i.custo)}</div></div></div>`).join('')||'<div class="empty">Nenhuma peça vendida ainda.</div>'}</div>
    <h3 class="sec">Devolver</h3>
    <div class="list">${A.devolver.map(p=>`<div class="item"><div class="th" style="background-image:url('${p.thumb||''}')"></div>
      <div class="mid"><div class="t">${esc(p.nome)}</div><div class="s">${esc(p.subcategoria||'')}${p.status==='reservado'?' · <span class="wrn">reservada</span>':''}</div></div>
      <div class="r">${brl(p.preco)}</div></div>`).join('')||'<div class="empty">Nada a devolver.</div>'}</div>
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="acp">Copiar resumo</button><button class="btn ghost" id="acsv">Baixar CSV</button></div>`);
  $('#acp').onclick=async()=>{const t=`Acerto ${cat} lote ${A.n} · ${L.fornecedor}\n\nVendidas (${A.vendidos.length}):\n${A.vendidos.map(x=>`• ${x.i.nome} ${x.i.subcategoria?'('+x.i.subcategoria+')':''} — ${brl(x.i.preco)}`).join('\n')}\nTotal etiqueta: ${brl(A.etiqueta)}\nRepasse: ${brl(A.repasse)}\n\nDevolução (${A.devolver.length}):\n${A.devolver.map(p=>`• ${p.nome} — ${brl(p.preco)}`).join('\n')}`;
    try{await navigator.clipboard.writeText(t);toast('Resumo copiado');}catch{alert(t);}};
  $('#acsv').onclick=()=>dlCSV(csvAcerto(A),`acerto-${LOTES[cat].key}-lote-${A.n}-${today()}.csv`);
}
const csvAcerto=A=>[['Situação','Peça','Tipo','Etiqueta','Repasse','Cliente','Data venda']]
  .concat(A.vendidos.map(({v,i})=>['Vendida',i.nome,i.subcategoria||'',num(i.preco),num(i.custo),v.clienteNome,fdate(v.data)]))
  .concat(A.devolver.map(p=>['Devolver',p.nome,p.subcategoria||'',num(p.preco),num(PRIV[p.id]?.custo),p.status==='reservado'?'(reservada)':'','']));

async function apagarProdutos(alvo,msgEl){
  const ids=new Set(alvo.map(p=>p.id)), ops=[];
  alvo.forEach(p=>['produtos','produtos_img','produtos_priv'].forEach(c=>ops.push(b=>b.delete(doc(db,c,p.id)))));
  R.filter(r=>r.status==='pendente'&&ids.has(r.produtoId)).forEach(r=>ops.push(b=>b.update(doc(db,'reservas',r.id),{status:'cancelada'})));
  for(let i=0;i<ops.length;i+=450){const b=writeBatch(db);ops.slice(i,i+450).forEach(f=>f(b));await b.commit();
    if(msgEl) msgEl.textContent=`Apagando… ${Math.min(i+450,ops.length)}/${ops.length}`;}
}
function encerrarLote(cat){
  const L=lc(cat), n=L.numero, A=dadosAcerto(cat,n), alvo=P.filter(p=>p.categoria===cat);
  open(`<h4>Encerrar ${esc(cat)} lote ${n}<button data-x>✕</button></h4>
    <p style="color:var(--muted);line-height:1.55;margin-bottom:14px">Remove as ${alvo.length} peças de ${esc(cat.toLowerCase())} da loja (${A.devolver.length} a devolver, ${alvo.length-A.devolver.length} vendidas). As vendas e o relatório ficam guardados. O próximo lote passa a ser o <b>${n+1}</b>.</p>
    ${A.reservados?`<div class="danger" style="margin-bottom:12px"><p style="margin:0">${A.reservados} peça${A.reservados===1?' ainda está reservada':'s ainda estão reservadas'}. As reservas serão canceladas.</p></div>`:''}
    <label class="chk"><input type="checkbox" id="ecsv" checked><span>Baixar relatório de acerto antes</span></label>
    <div class="fld" style="margin-top:12px"><label>Digite ENCERRAR para confirmar</label><input id="etxt" autocomplete="off" autocapitalize="characters"></div>
    <p id="emsg" style="color:var(--muted);font-size:.85rem;margin-bottom:10px"></p>
    <button class="btn red block" id="ego">Encerrar lote ${n}</button>`);
  $('#ego').onclick=async()=>{
    if($('#etxt').value.trim().toUpperCase()!=='ENCERRAR') return alert('Digite ENCERRAR para confirmar.');
    if($('#ecsv').checked) dlCSV(csvAcerto(A),`acerto-${LOTES[cat].key}-lote-${n}-${today()}.csv`);
    $('#ego').disabled=true;
    try{
      await apagarProdutos(alvo,$('#emsg'));
      const pub={lotesAte:{[cat]:''}}; if(cat==='Semijoias') pub.semijoiasAte='';
      await setDoc(doc(db,'config','loja'),pub,{merge:true});
      // só avança a numeração depois que a exclusão terminou
      await setDoc(doc(db,'admin_config',LOTES[cat].key),{numero:n+1,acerto:'',
        historico:[...(L.historico||[]),{numero:n,encerradoEm:today(),vendidas:A.vendidos.length,repasse:r2(A.repasse),devolvidas:A.devolver.length}]},{merge:true});
      close();toast(`Lote ${n} encerrado. Agora é o ${n+1}.`);
    }catch(e){console.error(e);alert('Parou no meio: '+e.message+'. Rode de novo para terminar; o número do lote só muda quando tudo for apagado.');$('#ego').disabled=false;}
  };
}

// fornecedores de produtos avulsos (não-lote)
function pendFornecedores(){
  const m={};
  itensVendidos(i=>!i.consignado&&i.fornecedor&&!i.acertadoEm).forEach(x=>{const f=x.i.fornecedor;(m[f]=m[f]||{nome:f,itens:0,repasse:0});m[f].itens++;m[f].repasse+=num(x.i.custo);});
  return Object.values(m).sort((a,b)=>b.repasse-a.repasse);
}
function acertoFornecedor(nome){
  const L=itensVendidos(i=>!i.consignado&&i.fornecedor===nome&&!i.acertadoEm);
  const repasse=L.reduce((a,x)=>a+num(x.i.custo),0), receb=L.reduce((a,x)=>a+x.recebido,0), venda=L.reduce((a,x)=>a+x.efetivo,0);
  const gap=Math.max(0,repasse-receb);
  open(`<h4>Acerto · ${esc(nome)}<button data-x>✕</button></h4>
    <div class="kpis">
      <div class="kpi hero"><small>Repassar a ${esc(nome)}</small><b>${brl(repasse)}</b><small>${L.length} ite${L.length===1?'m':'ns'} vendido${L.length===1?'':'s'} · ${brl(venda)} em vendas</small></div>
      <div class="kpi"><small>Seu lucro</small><b class="pos">${brl(venda-repasse)}</b></div>
      <div class="kpi"><small>Clientes ainda devem</small><b class="wrn">${brl(venda-receb)}</b></div>
    </div>
    ${gap>0.01?`<div class="danger" style="margin-bottom:12px"><p style="margin:0">Se acertar hoje, <b>${brl(gap)}</b> sai do seu caixa: as clientes ainda não pagaram tudo.</p></div>`:''}
    <div class="list">${L.map(({v,i})=>`<div class="item"><div class="th" style="background-image:url('${i.thumb||''}')"></div>
      <div class="mid"><div class="t">${esc(i.nome)}</div><div class="s">${esc(v.clienteNome)} · ${fdate(v.data)} · ${i.modo==='pct'?'comissão':'custo'}</div></div>
      <div class="r"><div style="font-weight:500">${brl(i.preco)}</div><div class="s">repasse ${brl(i.custo)}</div></div></div>`).join('')||'<div class="empty">Nada pendente com este fornecedor.</div>'}</div>
    ${L.length?`<div class="row" style="margin-top:14px"><button class="btn ghost" id="fcsv">Baixar CSV</button><button class="btn green" id="fok">Marcar como acertado</button></div>`:''}`);
  if(!L.length) return;
  $('#fcsv').onclick=()=>dlCSV([['Item','Cliente','Data venda','Preço','Repasse','Tipo']].concat(L.map(({v,i})=>[i.nome,v.clienteNome,fdate(v.data),num(i.preco),num(i.custo),i.modo==='pct'?'comissão':'custo'])),`acerto-${nome}-${today()}.csv`);
  $('#fok').onclick=async()=>{if(!confirm(`Confirmar que você pagou ${brl(repasse)} a ${nome}? Esses itens saem da lista de pendências.`))return;
    const porVenda={};L.forEach(x=>{(porVenda[x.v.id]=porVenda[x.v.id]||[]).push(x.idx);});
    const b=writeBatch(db),hj=today();
    Object.entries(porVenda).forEach(([vid,idxs])=>{const v=V.find(x=>x.id===vid);const itens=v.itens.map((i,k)=>idxs.includes(k)?{...i,acertadoEm:hj}:i);b.update(doc(db,'vendas',vid),{itens});});
    await b.commit();close();toast(`Acerto com ${nome} registrado`);};
}

function limparOutras(){
  const outros=P.filter(p=>!isLote(p.categoria)), cnt=s=>outros.filter(p=>p.status===s).length;
  open(`<h4>Limpar categorias<button data-x>✕</button></h4>
    <p style="color:var(--muted);line-height:1.55;margin-bottom:14px">Fitness, casual, perfumes, utilidades e eletrônicos: ${cnt('disponivel')} disponíveis, ${cnt('reservado')} reservados, ${cnt('encomenda')} sob encomenda. Os lotes não são afetados.</p>
    <label class="chk"><input type="checkbox" id="wkeep" checked><span>Manter itens reservados</span></label>
    <label class="chk"><input type="checkbox" id="wcsv" checked><span>Baixar lista antes de apagar</span></label>
    <div class="fld" style="margin-top:12px"><label>Digite LIMPAR para confirmar</label><input id="wtxt" autocomplete="off" autocapitalize="characters"></div>
    <p id="wmsg" style="color:var(--muted);font-size:.85rem;margin-bottom:10px"></p>
    <button class="btn red block" id="wgo">Apagar</button>`);
  $('#wgo').onclick=async()=>{
    if($('#wtxt').value.trim().toUpperCase()!=='LIMPAR') return alert('Digite LIMPAR para confirmar.');

    if(!alvo.length) return alert('Nada para apagar.');
    if($('#wcsv').checked) dlCSV([['Produto','Categoria','Fornecedor','Situação','Preço','Custo','Descrição']].concat(outros.map(p=>[p.nome,p.categoria||'',fornDe(p),p.status,num(p.preco),num(PRIV[p.id]?.custo),p.descricao||''])),`catalogo-${today()}.csv`);
    $('#wgo').disabled=true;

    catch(e){console.error(e);alert('Parou no meio: '+e.message+'. Rode de novo para terminar.');$('#wgo').disabled=false;}
  };
}
function verClientes(){
  const lista=Object.values(C).map(c=>{const vs=V.filter(v=>v.clienteWhats===c.whats);
    return {...c,vs,total:vs.reduce((a,v)=>a+v.valorTotal,0),aberto:vs.reduce((a,v)=>a+v.valorTotal-pago(v),0)};})
    .sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));
  open(`<h4>Clientes (${lista.length})<button data-x>✕</button></h4>
    <div class="fld"><input id="cq" type="search" placeholder="Buscar por nome ou número"></div>
    <div class="list" id="cl"></div>`);
  const draw=()=>{const q=$('#cq').value.trim().toLowerCase(),qd=q.replace(/\D/g,'');
    $('#cl').innerHTML=lista.filter(c=>!q||(c.nome||'').toLowerCase().includes(q)||(qd&&c.whats.includes(qd))).map(c=>`<div class="vcard">
      <div class="hd"><div style="min-width:0"><div style="font-weight:500">${esc(c.nome)}</div>
        <div style="color:var(--muted);font-size:.8rem">${fmtW(c.whats)} · ${c.vs.length} compra${c.vs.length===1?'':'s'}${c.vs.length?' · '+brl(c.total):''}</div>
        ${c.aberto>0.01?`<div class="wrn" style="font-size:.8rem">em aberto ${brl(c.aberto)}</div>`:''}</div>
        <a class="btn ghost sm" target="_blank" style="text-decoration:none;flex:none;align-self:flex-start" href="${wa(c.whats)}">WhatsApp</a></div>
      ${c.vs.length?`<div class="vitens">${c.vs.flatMap(v=>(v.itens||[]).map(i=>`<div><span class="mini" style="background-image:url('${i.thumb||''}')"></span><span>${itemTxt(i)} <span style="color:var(--muted)">· ${fdate(v.data)}</span></span><span>${brl(i.preco)}</span></div>`)).join('')}</div>`:''}
    </div>`).join('')||'<div class="empty">Nenhum cliente encontrado.</div>';};
  $('#cq').oninput=draw; draw();
}
