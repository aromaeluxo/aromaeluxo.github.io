<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eff0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Aroma e Luxo · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eff0;--p1:#fff;--p2:#faf7f8;--line:#e3d9dd;--wine:#6b2340;--wine2:#8a3354;--rose:#e9d3db;--txt:#2a1f24;--muted:#857880;--ok:#3f8f63;--warn:#b7791f;--err:#b83c3c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Figtree',system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.hide{display:none!important}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#login form{width:100%;max-width:340px}
#login h1{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:500;font-size:3rem;color:var(--wine);margin-bottom:22px;text-align:center}
#app{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 86px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top h2{font-family:'Bodoni Moda',serif;font-weight:500;font-size:1.9rem;color:var(--wine)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;color:var(--muted);font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button.on{color:var(--wine)}
nav .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--err);color:#fff;font-size:.65rem;border-radius:9px;padding:0 5px;min-width:16px}
@media(min-width:900px){#app{max-width:1100px;margin:0 auto}}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--wine);color:#fff;font-weight:600;cursor:pointer}
.btn.sm{padding:7px 13px;font-size:.85rem}
.btn.ghost{background:var(--p1);color:var(--txt);border:1px solid var(--line)}
.btn.red{background:transparent;color:var(--err);border:1px solid rgba(184,60,60,.35)}
.btn.green{background:var(--ok);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:11px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--wine)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--muted);font-size:.78rem}
.kpi b{display:block;font-size:1.3rem;font-weight:600;margin-top:2px}
.kpi.hero{grid-column:span 2;background:var(--wine);border-color:var(--wine);color:#fff}
.kpi.hero small{color:var(--rose)}
.kpi.hero b{font-family:'Bodoni Moda',serif;font-size:2.3rem;font-weight:500}
.pos{color:var(--ok)}.neg{color:var(--err)}.wrn{color:var(--warn)}
h3.sec{font-size:.95rem;font-weight:600;color:var(--wine);margin:22px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}
.item .th{width:56px;height:56px;border-radius:10px;background:var(--rose) center/cover;flex:none}
.item .mid{flex:1;min-width:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.item .r{text-align:right;flex:none}
.pill{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:9px;border:1px solid currentColor}
.pill.encomenda{color:var(--wine2)}.pill.disponivel{color:var(--ok)}.pill.reservado{color:var(--warn)}.pill.vendido{color:var(--muted)}
.seg{display:flex;background:var(--rose);border-radius:999px;padding:3px;margin-bottom:14px}
.seg button{flex:1;background:none;border:0;padding:8px;border-radius:999px;color:var(--wine);font-size:.85rem}
.seg button.on{background:var(--p1);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:.9rem}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:56px;height:56px;border-radius:50%;background:var(--wine);color:#fff;border:0;font-size:1.8rem;box-shadow:0 8px 22px rgba(107,35,64,.35);z-index:15}
.ov{position:fixed;inset:0;background:rgba(42,31,36,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--p1);width:100%;max-width:620px;max-height:94dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:16px}}
.sheet h4{font-family:'Bodoni Moda',serif;font-size:1.6rem;font-weight:500;color:var(--wine);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.sheet h4 button{background:none;border:0;color:var(--muted);font-size:1.3rem}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.photos .p{width:86px;height:86px;border-radius:10px;background:var(--rose) center/cover;position:relative}
.photos .p button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--err);color:#fff;font-size:.75rem}
.photos label.add{width:86px;height:86px;border-radius:10px;border:1.5px dashed var(--wine2);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--wine);font-size:.75rem;gap:4px;cursor:pointer}
.photos label.add svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.5}
.chk{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--p2)}
.chk input{width:20px;height:20px;accent-color:var(--wine)}
.chk .th{width:36px;height:36px;border-radius:6px;background:var(--rose) center/cover;flex:none}
.parc{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.parc input{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;min-width:0;font-size:15px}
.parc .n{color:var(--muted);font-size:.85rem}
.parc .pay{grid-column:2/4;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vcard{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.vcard .hd{display:flex;justify-content:space-between;gap:10px}
.vth{display:flex;gap:4px;margin-top:8px}.vth span{width:34px;height:34px;border-radius:6px;background:var(--rose) center/cover}
.bar{height:5px;background:var(--rose);border-radius:3px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--wine)}
.pl{display:flex;justify-content:space-between;align-items:center;font-size:.83rem;padding:6px 0;border-top:1px solid var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 90px);background:var(--txt);color:#fff;padding:10px 18px;border-radius:20px;font-weight:500;z-index:60;font-size:.9rem}
.tot{display:flex;justify-content:space-between;padding:10px 0;font-size:.95rem}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--p1);border-radius:999px;padding:7px 14px;font-size:.84rem;color:var(--muted)}
.chips button.on{background:var(--wine);border-color:var(--wine);color:#fff}
.sjb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--p1);border:1px solid var(--line);border-left:3px solid var(--wine);border-radius:12px;padding:12px 14px;margin-bottom:14px;cursor:pointer}
.sjb b{display:block;font-weight:600;color:var(--wine)}.sjb small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}.sjb>span:last-child{color:var(--muted);font-size:1.4rem}
.vitens{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.vitens>div{display:flex;align-items:center;gap:8px;font-size:.82rem}
.vitens>div>span:nth-child(2){flex:1;min-width:0}
.vitens .mini{width:28px;height:28px;border-radius:6px;background:var(--rose) center/cover;flex:none}
body.discreto .priv{color:transparent!important;background:var(--rose);border-radius:5px;user-select:none;-webkit-user-select:none}
.kpi.hero .priv{border-radius:7px}
.eye{padding:7px 10px}.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;display:block}
.eye .slash{display:none}body.discreto .eye .slash{display:inline}
.cbox{position:relative}
.csr{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--p1);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(42,31,36,.15);z-index:5;overflow:hidden}
.csr button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 12px;font-size:.92rem}
.csr button:last-child{border-bottom:0}.csr button span{color:var(--muted);font-size:.82rem;flex:none}
.csr button.novo{color:var(--wine);justify-content:flex-start;gap:4px}
.ficha{width:100%;text-align:left;cursor:pointer;margin-bottom:0}
.vbloco{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--p2)}
.vbloco .hd{display:flex;justify-content:space-between;gap:10px}
.vitens .xi{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--p1);color:var(--muted);font-size:.7rem;cursor:pointer}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block;color:#000;font:12px/1.4 Figtree,Arial,sans-serif;padding:10mm}
  #printArea h1{font:600 18px Figtree,Arial,sans-serif;margin-bottom:2px}#printArea p{color:#555;margin-bottom:10px}
  #printArea table{width:100%;border-collapse:collapse}#printArea th,#printArea td{border-bottom:1px solid #ccc;padding:6px 4px;text-align:left;vertical-align:top}
  #printArea tfoot td{font-weight:600;border-top:2px solid #000}}
.frow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.frow input,.frow select{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:9px;min-width:0;font-size:15px}
.frow [data-k="n"]{flex:1.2}.frow select{flex:1.2}.frow [data-k="c"]{flex:.6}
.frow button{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--p1);color:var(--muted)}
.rth{width:46px;height:46px;border-radius:8px;background:var(--rose) center/cover;flex:none}
.danger{border:1px solid rgba(184,60,60,.3);border-radius:14px;padding:14px;background:#fff}
.danger p{color:var(--muted);font-size:.86rem;line-height:1.55;margin-bottom:10px}
</style>
</head>
<body class="discreto">

<section id="login" class="hide">
  <form id="lf">
    <h1>Aroma <span style="font-family:Figtree,sans-serif;font-style:normal;font-size:.36em;letter-spacing:.12em;color:var(--wine2);vertical-align:.5em">e</span> Luxo<small style="display:block;font-family:Figtree,sans-serif;font-style:normal;font-size:.8rem;letter-spacing:.38em;text-transform:uppercase;color:var(--txt);margin-top:8px">Admin</small></h1>
    <div class="fld"><label>E-mail</label><input id="le" type="email" autocomplete="username" required></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, onSnapshot, writeBatch, setDoc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// >>> MESMA CONFIG DO index.html
const firebaseConfig = {
  apiKey: "AIzaSyAosvL5iqvBKiigtPZ7SmtRFvZoApBvyHk",
  authDomain: "marilia-loja.firebaseapp.com",
  projectId: "marilia-loja",
  storageBucket: "marilia-loja.firebasestorage.app",
  messagingSenderId: "177612077044",
  appId: "1:177612077044:web:c7993a1d7219c6ccf46ba1"
};
const APP_V = 21;   // manter igual ao número em sw.js (marilia-adm-vNN)
const ADMIN_UIDS = ["YIA9hIVIs0bJWAMvp8LsMPyDUsy1", "KJ9qu8kZTpejzHi3jzI5DERERMG3"];   // Authentication > Users. Pode ter 1 ou 2 (você e a Marília)

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app,{localCache:persistentLocalCache()});
setPersistence(auth,browserLocalPersistence);

const $=s=>document.querySelector(s);
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fdate=s=>s?s.split('-').reverse().join('/'):'—';
const addMonths=(s,n)=>{const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1+n,1);const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();dt.setDate(Math.min(d,last));return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`};
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;let t=String(v??'').trim().replace(/[^\d,.-]/g,'');
  if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');return parseFloat(t)||0;};
const LOTES={'Semijoias':{key:'semijoias',subs:['Correntes','Pingentes','Pulseiras','Anéis','Brincos','Conjuntos'],forn:'Missara'},
  'Roupa Íntima':{key:'roupaintima',subs:['Conjuntos','Calcinhas','Sutiãs','Meias','Cuecas','Pijamas'],forn:'Justen'}};
const LOTE_CATS=Object.keys(LOTES), isLote=c=>!!LOTES[c];
const CATS=['Semijoias','Roupa Íntima','Fitness','Casual','Perfumes e Cosméticos','Utilidades','Eletrônicos'];
const VEST=['Roupa Íntima','Fitness','Casual'], isVest=c=>VEST.includes(c);
const catOptions=sel=>CATS.filter(c=>!isVest(c)).slice(0,1).map(c=>`<option ${sel===c?'selected':''}>${c}</option>`).join('')
  +`<optgroup label="Vestuário">${VEST.map(c=>`<option ${sel===c?'selected':''}>${c}</option>`).join('')}</optgroup>`
  +CATS.filter(c=>!isVest(c)).slice(1).map(c=>`<option ${sel===c?'selected':''}>${c}</option>`).join('');
const diasAte=s=>Math.round((new Date(s+'T12:00')-new Date(today()+'T12:00'))/864e5);
const fmtW=w=>{const d=String(w||'').replace(/\D/g,'');return d.length>=10?`(${d.slice(0,2)}) ${d.slice(2,-4)}-${d.slice(-4)}`:d};
const r2=v=>Math.round(v*100)/100;
const lc=cat=>{const x=LC[cat]||{};return {numero:1,acerto:'',comissao:30,historico:[],...x,fornecedor:x.fornecedor||LOTES[cat].forn};};
const menos1=s=>{if(!s)return '';const [y,m,d]=s.split('-').map(Number),dt=new Date(y,m-1,d-1);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;};
const dlCSV=(L,nome)=>{const csv='\ufeff'+L.map(r=>r.map(c=>typeof c==='number'?String(r2(c)).replace('.',','):`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=nome;a.click();};
const wa=(w,t='')=>`https://wa.me/55${String(w).replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'')}${t?'?text='+encodeURIComponent(t):''}`;
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const uid=()=>doc(collection(db,'x')).id;

let P=[], PRIV={}, R=[], V=[], CFG={}, tab='resumo', mes=today().slice(0,7), pFiltro='disponivel', vFiltro='abertas';
let unsubs=[], LC={}, FORN=['Tati','Brandon','Missara','Justen'], FCFG={}, C={}, cLoaded=false, clientesSync=new Set(), pCat='', pBusca='';

// ---------- auth ----------
onAuthStateChanged(auth,u=>{
  if(u && ADMIN_UIDS.includes(u.uid)){ $('#login').classList.add('hide'); ['#app','#nav'].forEach(s=>$(s).classList.remove('hide')); listen(); }
  else{ if(u) signOut(auth); unsubs.forEach(f=>f()); unsubs=[]; $('#login').classList.remove('hide'); ['#app','#nav','#fab'].forEach(s=>$(s).classList.add('hide')); }
});

function listen(){
  unsubs.push(onSnapshot(collection(db,'produtos'),s=>{P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.criadoEm?.seconds||9e9)-(a.criadoEm?.seconds||9e9));render();}));
  unsubs.push(onSnapshot(collection(db,'produtos_priv'),s=>{PRIV={};s.docs.forEach(d=>PRIV[d.id]=d.data());render();}));
  unsubs.push(onSnapshot(collection(db,'reservas'),s=>{R=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.criadoEm?.seconds||9e9)-(a.criadoEm?.seconds||9e9));
    const n=R.filter(r=>r.status==='pendente').length;$('#bdg').textContent=n;$('#bdg').classList.toggle('hide',!n);syncClientes();render();}));
  unsubs.push(onSnapshot(collection(db,'vendas'),s=>{V=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.data||'').localeCompare(a.data||''));syncClientes();render();}));
  LOTE_CATS.forEach(cat=>unsubs.push(onSnapshot(doc(db,'admin_config',LOTES[cat].key),d=>{LC[cat]=d.exists()?d.data():{};render();})));
  unsubs.push(onSnapshot(doc(db,'admin_config','geral'),d=>{const x=d.exists()?d.data():{};if(Array.isArray(x.fornecedores)&&x.fornecedores.length)FORN=x.fornecedores;FCFG=x.fornCfg||{};render();}));
  unsubs.push(onSnapshot(collection(db,'clientes'),s=>{C={};s.docs.forEach(d=>C[d.id]=d.data());cLoaded=true;syncClientes();}));
  getDoc(doc(db,'config','loja')).then(d=>{CFG=d.exists()?d.data():{};});
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);render();});

// clientes: tudo que chega por reserva ou venda vira cadastro (chave = WhatsApp)
function syncClientes(){ if(!cLoaded) return; const add={};
  [...R.map(r=>[r.clienteWhats,r.clienteNome]),...V.map(v=>[v.clienteWhats,v.clienteNome])].forEach(([w,n])=>{
    w=String(w||'').replace(/\D/g,''); if(w.length>=10&&n&&!C[w]&&!clientesSync.has(w)&&!add[w]) add[w]=n;});
  const ks=Object.keys(add).slice(0,400); if(!ks.length) return; const b=writeBatch(db);
  ks.forEach(w=>{clientesSync.add(w);b.set(doc(db,'clientes',w),{nome:add[w],whats:w,criadoEm:serverTimestamp()},{merge:true});});
  b.commit().catch(e=>{console.error(e);ks.forEach(w=>clientesSync.delete(w));});
}
const snapItem=p=>{const pv=PRIV[p.id]||{},lt=isLote(p.categoria);return {produtoId:p.id,nome:p.nome,preco:num(p.preco),custo:num(pv.custo),thumb:p.thumb||'',
  categoria:p.categoria||'',subcategoria:p.subcategoria||'',tamanho:p.tamanho||'',catalogo:lt?(p.catalogo||lc(p.categoria).numero):null,consignado:lt,
  fornecedor:lt?lc(p.categoria).fornecedor:(pv.fornecedor||''),modo:lt?'pct':(pv.modo||'custo')};};

// ---------- cálculos ----------
const pago=v=>(v.parcelas||[]).reduce((s,p)=>s+(p.pagoEm?num(p.valorPago):0),0);
const margem=v=>v.valorTotal>0?(v.valorTotal-(v.custoTotal||0))/v.valorTotal:0;
const aberta=v=>(v.parcelas||[]).some(p=>!p.pagoEm);

// ---------- RESUMO ----------
function vResumo(){
  const vm=V.filter(v=>(v.data||'').startsWith(mes));
  const fat=vm.reduce((s,v)=>s+v.valorTotal,0);
  const lucroBruto=vm.reduce((s,v)=>s+v.valorTotal-(v.custoTotal||0),0);
  let receb=0,lucroReal=0; const venc=[],prox=[]; let aReceber=0;
  const hj=today(), em7=(()=>{const d=new Date();d.setDate(d.getDate()+7);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)})();
  V.forEach(v=>(v.parcelas||[]).forEach(p=>{
    if(p.pagoEm&&p.pagoEm.startsWith(mes)){receb+=num(p.valorPago);lucroReal+=num(p.valorPago)*margem(v);}
    if(!p.pagoEm){aReceber+=num(p.valor);
      if(p.vencimento<hj) venc.push({v,p}); else if(p.vencimento<=em7) prox.push({v,p});}
  }));
  let recebTot=0,lucroRealTot=0; V.forEach(v=>(v.parcelas||[]).forEach(p=>{if(p.pagoEm){recebTot+=num(p.valorPago);lucroRealTot+=num(p.valorPago)*margem(v);}}));
  const fatTot=V.reduce((s,v)=>s+v.valorTotal,0);
  const estoque=P.filter(p=>p.status==='disponivel'||p.status==='reservado').reduce((s,p)=>s+(num(PRIV[p.id]?.custo)),0);
  const cob=({v,p},atrasada)=>`<div class="item"><div class="mid"><div class="t">${esc(v.clienteNome)}</div>
      <div class="s">Parcela ${p.n}/${v.parcelas.length} · vence ${fdate(p.vencimento)}</div></div>
      <div class="r"><div class="${atrasada?'neg':''}" style="font-weight:500">${brl(p.valor)}</div>
      <a class="btn ghost sm" style="display:inline-block;margin-top:4px;text-decoration:none" target="_blank" href="${wa(v.clienteWhats,`Olá ${v.clienteNome.split(' ')[0]}! Lembrete da parcela ${p.n} de ${brl(p.valor)}, com vencimento em ${fdate(p.vencimento)}.`)}">Cobrar</a></div></div>`;
  $('#view').innerHTML=`
    ${lotesAtivos().map(loteBanner).join('')}
    <div class="fld"><input type="month" id="mes" value="${mes}"></div>
    <div class="kpis">
      <div class="kpi hero"><small>Lucro realizado no mês</small><b class="priv">${brl(lucroReal)}</b><small>proporcional ao que entrou no caixa</small></div>
      <div class="kpi"><small>Vendido no mês</small><b>${brl(fat)}</b></div>
      <div class="kpi"><small>Recebido no mês</small><b class="pos">${brl(receb)}</b></div>
      <div class="kpi"><small>Lucro bruto das vendas</small><b class="priv">${brl(lucroBruto)}</b><small class="priv">${fat?Math.round(lucroBruto/fat*100):0}% de margem</small></div>
      <div class="kpi"><small>A receber (total)</small><b class="wrn">${brl(aReceber)}</b></div>
      <div class="kpi"><small>Custo em estoque</small><b class="priv">${brl(estoque)}</b></div>
      <div class="kpi"><small>Vendas no mês</small><b>${vm.length}</b></div>
    </div>
    <h3 class="sec">Desde o início</h3>
    <div class="kpis">
      <div class="kpi"><small>Total vendido</small><b>${brl(fatTot)}</b><small>${V.length} vendas</small></div>
      <div class="kpi"><small>Total recebido</small><b class="pos">${brl(recebTot)}</b></div>
      <div class="kpi"><small>Lucro realizado</small><b class="priv">${brl(lucroRealTot)}</b></div>
      <div class="kpi"><small>Ainda a receber</small><b class="wrn">${brl(aReceber)}</b></div>
    </div>
    <h3 class="sec">Parcelas vencidas (${venc.length})</h3>
    <div class="list">${venc.sort((a,b)=>a.p.vencimento.localeCompare(b.p.vencimento)).map(x=>cob(x,1)).join('')||'<div class="empty">Nenhuma parcela atrasada.</div>'}</div>
    <h3 class="sec">Vencem nos próximos 7 dias (${prox.length})</h3>
    <div class="list">${prox.sort((a,b)=>a.p.vencimento.localeCompare(b.p.vencimento)).map(x=>cob(x,0)).join('')||'<div class="empty">Nada vencendo esta semana.</div>'}</div>`;
  $('#mes').onchange=e=>{mes=e.target.value||today().slice(0,7);render();};
}

function loteBanner(cat){
  const L=lc(cat), n=P.filter(p=>p.categoria===cat&&p.status!=='vendido').length, d=L.acerto?diasAte(L.acerto):null;
  const cls=d==null?'':d<0?'neg':d<=7?'wrn':'';
  const quando=d==null?'sem data de acerto':`acerto ${fdate(L.acerto)} <span class="${cls}">(${d<0?`atrasado ${-d} dia${d===-1?'':'s'}`:d===0?'hoje':`em ${d} dia${d===1?'':'s'}`})</span>`;
  return `<button class="sjb" data-lote="${esc(cat)}"><span><b>${esc(cat)} · lote ${L.numero}</b><small>${esc(L.fornecedor)} · ${n} peça${n===1?'':'s'} na vitrine · ${quando}</small></span><span aria-hidden="true">›</span></button>`;
}
const lotesAtivos=()=>LOTE_CATS.filter(c=>P.some(p=>p.categoria===c)||lc(c).acerto);
const fornDe=p=>isLote(p.categoria)?lc(p.categoria).fornecedor:(PRIV[p.id]?.fornecedor||'');
const ST={disponivel:'Disponíveis',reservado:'Reservados',encomenda:'Encomenda',vendido:'Vendidos'};
function vProdutos(){
  const qb=pBusca.trim().toLowerCase();

    <div class="fld" style="margin-bottom:10px"><input id="pq" type="search" placeholder="Buscar nesta categoria" value="${esc(pBusca)}"></div>

      <div class="th" style="background-image:url('${p.thumb||''}')"></div>

      <div class="r"><div style="font-weight:500">${brl(p.preco)}</div><div class="s">${pct?'comissão':'custo'} <span class="priv">${pct?brl(num(p.preco)-c):brl(c)}</span></div></div></div>`}).join('')||`<div class="empty">${pFiltro==='disponivel'?'Toque em + para cadastrar.':'Nenhum produto aqui.'}</div>`}</div>`;
  $('#view').querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{pCat=b.dataset.c;render();});
  $('#pq').oninput=e=>{pBusca=e.target.value;const pos=e.target.selectionStart;render();const n=$('#pq');n.focus();n.setSelectionRange(pos,pos);};

function compress(file,max,q){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q));};
  img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u;});}
function thumbFrom(dataUrl){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=360,c=document.createElement('canvas');c.width=c.height=s;
  const m=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);res(c.toDataURL('image/jpeg',.7));};img.src=dataUrl;});}

async function formProduto(id){
  const p=id?P.find(x=>x.id===id):{status:'disponivel',ativo:true,categoria:pCat||''};
  const pv=id?(PRIV[id]||{}):{};
  const f2=v=>v!=null&&v!==''?String(v).replace('.',','):'';
  let imgs=[];
  if(id){const d=await getDoc(doc(db,'produtos_img',id));imgs=d.exists()?(d.data().imgs||[]):(p.thumb?[p.thumb]:[]);}
  const fornList=[...new Set([...FORN,pv.fornecedor].filter(Boolean))];
  open(`<h4>${id?'Editar produto':'Novo produto'}<button data-x>✕</button></h4>
    <div class="photos" id="ph"></div>
    <div class="fld"><label>Nome</label><input id="pn" value="${esc(p.nome||'')}" maxlength="80"></div>
    <div class="row"><div class="fld"><label>Categoria</label><select id="pk"><option value="">Escolha…</option>${catOptions(p.categoria)}</select></div>
      <div class="fld" id="psubw"><label>Tipo</label><select id="psub"></select></div>
      <div class="fld" id="pfw"><label>Fornecedor</label><select id="pf2"><option value="">Escolha…</option>${fornList.map(f=>`<option ${pv.fornecedor===f?'selected':''}>${esc(f)}</option>`).join('')}</select></div></div>
    <div class="seg" id="pmode"><button type="button" data-m="custo">Custo em R$</button><button type="button" data-m="pct">Comissão em %</button></div>
    <div class="row"><div class="fld"><label id="ppl">Preço de venda (R$)</label><input id="pp" inputmode="decimal" value="${f2(p.preco)}"></div>
      <div class="fld" id="pcw"><label>Custo (R$)</label><input id="pc" inputmode="decimal" value="${f2(pv.custo)}"></div>
      <div class="fld" id="pmw"><label>Sua comissão (%)</label><input id="pm" inputmode="decimal" value="${f2(pv.comissao??(isLote(p.categoria)?lc(p.categoria).comissao:''))}"></div></div>
    <p id="pinfo" style="font-size:.82rem;color:var(--muted);margin:-4px 0 12px;line-height:1.45"></p>
    <div class="fld" id="ptw"><label>Tamanho(s)</label><input id="pt" value="${esc(p.tamanho||'')}" maxlength="30" placeholder="Ex.: M · P/M/G · 38 · Único"></div>
    <div class="fld"><label>Descrição</label><textarea id="pd" rows="3" maxlength="800">${esc(p.descricao||'')}</textarea></div>
    <div class="row"><div class="fld"><label>Situação</label><select id="ps"></select></div>
      <div class="fld"><label>Na loja</label><select id="pa"><option value="1" ${p.ativo!==false?'selected':''}>Visível</option><option value="0" ${p.ativo===false?'selected':''}>Oculto</option></select></div></div>
    <p id="pmsg" style="color:var(--muted);font-size:.8rem;margin-bottom:10px"></p>
    <button class="btn block" id="psave">${id?'Salvar alterações':'Cadastrar produto'}</button>
    ${id?'<button class="btn red block" id="pdel" style="margin-top:10px">Excluir produto</button>':''}`);
  const catNum=c=>id&&p.categoria===c&&p.catalogo?p.catalogo:lc(c).numero;
  let modo=pv.modo||(!isLote(p.categoria)&&pv.comissao!=null?'pct':'custo'), lastCat=p.categoria||'';
  const pctOn=()=>isLote($('#pk').value)||modo==='pct';
  const upd=()=>{const cat=$('#pk').value,lt=isLote(cat),pct=pctOn();
    if(cat!==lastCat){ if(lt) $('#pm').value=f2(lc(cat).comissao); lastCat=cat; }
    if(lt){const cur=$('#psub').value||p.subcategoria;$('#psub').innerHTML=LOTES[cat].subs.map(x=>`<option ${cur===x?'selected':''}>${x}</option>`).join('');}
    const sts=lt?['disponivel','reservado','vendido']:['disponivel','reservado','encomenda','vendido'], curS=$('#ps').value||p.status;
    $('#ps').innerHTML=sts.map(x=>`<option value="${x}" ${curS===x?'selected':''}>${{disponivel:'Disponível',reservado:'Reservado',encomenda:'Sob encomenda',vendido:'Vendido'}[x]}</option>`).join('');
    $('#pmode').classList.toggle('hide',lt);$('#pmode').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===modo));
    $('#psubw').classList.toggle('hide',!lt);$('#ptw').classList.toggle('hide',!isVest(cat));$('#pfw').classList.toggle('hide',lt||!cat);
    $('#pcw').classList.toggle('hide',pct);$('#pmw').classList.toggle('hide',!pct);
    $('#ppl').textContent=lt?'Preço da etiqueta (R$)':'Preço de venda (R$)';
    const pr=num($('#pp').value), quem=lt?lc(cat).fornecedor:($('#pf2').value||'ao fornecedor');
    if(pct){const m=num($('#pm').value);
      $('#pinfo').innerHTML=`${lt?`Lote ${catNum(cat)} · `:''}você recebe <b>${brl(pr*m/100)}</b> e repassa <b>${brl(pr-pr*m/100)}</b>${lt||$('#pf2').value?' a '+esc(quem):' ao fornecedor'}.`;}
    else{const c=num($('#pc').value);$('#pinfo').innerHTML=pr&&$('#pc').value?`Lucro de <b>${brl(pr-c)}</b> (${Math.round((pr-c)/pr*100)}% do preço).`:'';}};
  $('#pmode').querySelectorAll('button').forEach(b=>b.onclick=()=>{modo=b.dataset.m;upd();});
  ['#pp','#pm','#pc'].forEach(x=>$(x).oninput=upd); $('#pk').onchange=upd; $('#pf2').onchange=()=>{const c=FCFG[$('#pf2').value];if(c?.tipo){modo=c.tipo;if(c.tipo==='pct'&&c.comissao!=null)$('#pm').value=f2(c.comissao);}upd();}; upd();
  const drawPh=()=>{$('#ph').innerHTML=imgs.map((x,i)=>`<div class="p" style="background-image:url('${x}')"><button data-i="${i}" aria-label="Remover foto">✕</button></div>`).join('')+

    $('#ph').querySelectorAll('button').forEach(b=>b.onclick=()=>{imgs.splice(+b.dataset.i,1);drawPh();});

      $('#pmsg').textContent=`${imgs.length}/3 fotos · ${Math.round(imgs.join('').length/1024)} KB`;drawPh();};};

    if(!lt&&!forn) return alert('Escolha o fornecedor.');
    if(preco<=0) return alert('Informe o preço.');
    const pct=pctOn(), comissao=pct?num($('#pm').value):null;
    if(pct&&(comissao<=0||comissao>=100)) return alert('A comissão precisa estar entre 1% e 99%.');
    const custo=pct?r2(preco*(1-comissao/100)):num($('#pc').value);
    if(!imgs.length) return alert('Adicione pelo menos uma foto.');
    if(imgs.join('').length>950000) return alert('As fotos passaram do limite. Remova uma.');
    $('#psave').disabled=true;$('#psave').textContent='Salvando…';
    const pid=id||uid(), b=writeBatch(db);
    const data={nome,preco,categoria:cat,subcategoria:lt?$('#psub').value:'',catalogo:lt?catNum(cat):null,tamanho:isVest(cat)?$('#pt').value.trim():'',

    if(!id) data.criadoEm=serverTimestamp();
    b.set(doc(db,'produtos',pid),data,{merge:true});
    b.set(doc(db,'produtos_img',pid),{imgs});

// mantém parcelas pagas como estão e redistribui o saldo nas que faltam
function redistribuir(parcelas,total){
  const pagas=parcelas.filter(p=>p.pagoEm), abertas=parcelas.filter(p=>!p.pagoEm);
  const saldo=r2(total-pagas.reduce((a,p)=>a+num(p.valor),0));
  if(saldo<-0.009) return {erro:`A cliente já pagou ${brl(-saldo)} a mais do que o novo total. Ajuste manualmente (devolução ou crédito) em Editar venda.`};
  if(!abertas.length) return {parcelas, sobra:saldo};
  const base=Math.floor(saldo/abertas.length*100)/100, resto=r2(saldo-base*abertas.length);
  let k=0; return {parcelas:parcelas.map(p=>p.pagoEm?p:{...p,valor:r2(base+(k++===0?resto:0))})};
}
async function cancelarItem(vid,idx){
  const v=V.find(x=>x.id===vid), it=v.itens[idx];
  const soma=v.itens.reduce((a,i)=>a+num(i.preco),0)||1, efetivo=r2(num(it.preco)*v.valorTotal/soma);
  const p=P.find(x=>x.id===it.produtoId), volta=p&&!emOutraVenda(it.produtoId,vid);
  if(v.itens.length===1){
    if(pago(v)>0.009) return alert(`Este é o único item da venda e já houve pagamento de ${brl(pago(v))}. Use Editar venda para decidir o que fazer com o valor pago.`);
    if(!confirm(`Cancelar "${it.nome}"? É o único item, então a venda inteira será excluída${volta?' e o produto volta para disponível':''}.`)) return;
    const b=writeBatch(db);b.delete(doc(db,'vendas',vid));if(volta)b.update(doc(db,'produtos',p.id),{status:'disponivel'});
    await b.commit();toast('Venda cancelada');voltar();return;}
  const novoTotal=r2(v.valorTotal-efetivo), red=redistribuir(v.parcelas||[],novoTotal);
  if(red.erro) return alert(red.erro);
  if(red.sobra>0.009) return alert('Todas as parcelas já estão pagas. Use Editar venda para registrar a diferença.');
  if(!confirm(`Cancelar "${it.nome}"?\n\nTotal da venda: ${brl(v.valorTotal)} → ${brl(novoTotal)}\nParcelas pagas ficam como estão; o saldo é redistribuído nas que faltam.${volta?'\nO produto volta para disponível.':''}`)) return;
  const itens=v.itens.filter((_,k)=>k!==idx);
  const b=writeBatch(db);
  b.update(doc(db,'vendas',vid),{itens,valorTotal:novoTotal,custoTotal:r2(itens.reduce((a,i)=>a+num(i.custo),0)),parcelas:red.parcelas,atualizadoEm:serverTimestamp()});
  if(volta) b.update(doc(db,'produtos',p.id),{status:'disponivel'});
  await b.commit();toast('Item cancelado');voltar();
}

    const base=livres?Math.floor(saldo/livres*100)/100:0, resto=livres?Math.round((saldo-base*livres)*100)/100:0; let k=0;
    v.parcelas=Array.from({length:n},(_,i)=>{const o=old[i]||{};
      if(o.pagoEm) return {...o,n:i+1};

// itens vendidos com valor efetivo (desconto rateado) e quanto já foi recebido de cada um
function itensVendidos(filtro){
  const out=[];
  V.forEach(v=>{const soma=(v.itens||[]).reduce((a,i)=>a+num(i.preco),0)||1, ratio=v.valorTotal/soma, fPago=v.valorTotal>0?pago(v)/v.valorTotal:0;
    (v.itens||[]).forEach((i,idx)=>{if(filtro(i)){const efetivo=num(i.preco)*ratio;out.push({v,i,idx,efetivo,recebido:efetivo*fPago});}});});
  return out;
}
function dadosAcerto(cat,n){
  const vendidos=itensVendidos(i=>i.consignado&&(i.categoria||'Semijoias')===cat&&i.catalogo===n);
  const devolver=P.filter(p=>p.categoria===cat&&(p.catalogo||n)===n&&p.status!=='vendido');
  const etiqueta=vendidos.reduce((a,x)=>a+num(x.i.preco),0), repasse=vendidos.reduce((a,x)=>a+num(x.i.custo),0);
  const efetivo=vendidos.reduce((a,x)=>a+x.efetivo,0), recebido=vendidos.reduce((a,x)=>a+x.recebido,0);
  return {cat,n,vendidos,devolver,etiqueta,repasse,comissao:efetivo-repasse,recebido,falta:efetivo-recebido,
    reservados:devolver.filter(p=>p.status==='reservado').length,valorDevolver:devolver.reduce((a,p)=>a+num(p.preco),0)};
}

// fornecedores de produtos avulsos (não-lote)
function pendFornecedores(){
  const m={};
  itensVendidos(i=>!i.consignado&&i.fornecedor&&!i.acertadoEm).forEach(x=>{const f=x.i.fornecedor;(m[f]=m[f]||{nome:f,itens:0,repasse:0});m[f].itens++;m[f].repasse+=num(x.i.custo);});
  return Object.values(m).sort((a,b)=>b.repasse-a.repasse);
}
function acertoFornecedor(nome){

    <div class="kpis">
      <div class="kpi hero"><small>Repassar a ${esc(nome)}</small><b>${brl(repasse)}</b><small>${L.length} ite${L.length===1?'m':'ns'} vendido${L.length===1?'':'s'} · ${brl(venda)} em vendas</small></div>
      <div class="kpi"><small>Seu lucro</small><b class="pos">${brl(venda-repasse)}</b></div>
      <div class="kpi"><small>Clientes ainda devem</small><b class="wrn">${brl(venda-receb)}</b></div>
    </div>

    <div class="list">${L.map(({v,i})=>`<div class="item"><div class="th" style="background-image:url('${i.thumb||''}')"></div>
      <div class="mid"><div class="t">${esc(i.nome)}</div><div class="s">${esc(v.clienteNome)} · ${fdate(v.data)} · ${i.modo==='pct'?'comissão':'custo'}</div></div>
      <div class="r"><div style="font-weight:500">${brl(i.preco)}</div><div class="s">repasse ${brl(i.custo)}</div></div></div>`).join('')||'<div class="empty">Nada pendente com este fornecedor.</div>'}</div>
    ${L.length?`<div class="row" style="margin-top:14px"><button class="btn ghost" id="frel">Relatório</button><button class="btn ghost" id="fcsv">CSV</button><button class="btn green" id="fok">Marcar como acertado</button></div>`:''}`);
  if(!L.length) return;
  $('#frel').onclick=()=>relatorioFornecedor(nome);

    const b=writeBatch(db),hj=today();
    Object.entries(porVenda).forEach(([vid,idxs])=>{const v=V.find(x=>x.id===vid);const itens=v.itens.map((i,k)=>idxs.includes(k)?{...i,acertadoEm:hj}:i);b.update(doc(db,'vendas',vid),{itens});});
    await b.commit();close();toast(`Acerto com ${nome} registrado`);};
}

// ---------- PDF (gerado no aparelho; no iPhone abre o menu de compartilhar: WhatsApp, Salvar em Arquivos…) ----------
const JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', JSPDF_AT='https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
const loadScript=src=>new Promise((res,rej)=>{const ex=document.querySelector(`script[src="${src}"]`);if(ex&&ex.dataset.ok)return res();
  const s=ex||document.createElement('script');s.src=src;s.onload=()=>{s.dataset.ok=1;res();};s.onerror=()=>{s.remove();rej(new Error('falha '+src));};if(!ex)document.head.appendChild(s);});
let pdfPronto=null;
const prepPDF=()=>pdfPronto||(pdfPronto=loadScript(JSPDF).then(()=>loadScript(JSPDF_AT)).catch(e=>{pdfPronto=null;throw e;}));
async function pdfTabela({titulo,sub,head,body,foot,arquivo,imgs}){
  const t=x=>String(x??'').replace(/\u00a0/g,' ');
  const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  d.setFont('helvetica','bold');d.setFontSize(14);d.setTextColor(42,31,36);d.text(t(titulo),14,16);
  d.setFont('helvetica','normal');d.setFontSize(9);d.setTextColor(120,110,115);d.text(t(sub),14,22);
  const comFoto=Array.isArray(imgs)&&imgs.some(Boolean), F=14;
  if(comFoto){head=['',...head];body=body.map(r=>['',...r]);if(foot)foot=['',...foot];}
  d.autoTable({startY:27,head:[head.map(t)],body:body.map(r=>r.map(t)),foot:foot?[foot.map(t)]:undefined,theme:'grid',showFoot:'lastPage',
    columnStyles:comFoto?{0:{cellWidth:F+2}}:{},bodyStyles:comFoto?{minCellHeight:F+2,valign:'middle'}:{},
    didDrawCell:comFoto?(c=>{if(c.section==='body'&&c.column.index===0){const im=imgs[c.row.index];
      if(im)try{c.doc.addImage(im,'JPEG',c.cell.x+1,c.cell.y+1,F,F);}catch{}}}):undefined,
    styles:{fontSize:8.5,cellPadding:2,lineColor:[227,217,221],textColor:[42,31,36]},headStyles:{fillColor:[107,35,64],textColor:255},
    footStyles:{fillColor:[243,239,240],textColor:[42,31,36],fontStyle:'bold'},margin:{left:14,right:14}});
  const blob=d.output('blob'), file=new File([blob],arquivo,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:t(titulo)});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=arquivo;document.body.appendChild(a);a.click();a.remove();
}

// ---------- relatório para o fornecedor (sem dados da cliente) ----------
const fornItem=i=>i.fornecedor||(i.consignado?lc(i.categoria||'Semijoias').fornecedor:'');
const fornDeLote=n=>LOTE_CATS.some(c=>lc(c).fornecedor===n);
// modelo de negociação: 'pct' = preço fixo do fornecedor + sua comissão; 'custo' = valor do fornecedor + sua margem
const tipoForn=n=>fornDeLote(n)?'pct':(FCFG[n]?.tipo||'');
const condicao=v=>{const ps=v.parcelas||[];if(!ps.length)return '';
  const dias=ps.map(p=>Math.max(0,Math.round((new Date(p.vencimento+'T12:00')-new Date((v.data||p.vencimento)+'T12:00'))/864e5)));
  if(ps.length===1) return dias[0]<=1?'À vista':`${dias[0]} dias`;
  return `${ps.length}x · ${dias[0]<=1?'entrada + ':''}${dias.filter((d,k)=>!(k===0&&d<=1)).join('/')} dias`;};
function linhasFornecedor(nome,{de,ate,soPend}){
  return itensVendidos(i=>fornItem(i)===nome).filter(({v,i})=>{
    if(de&&(v.data||'')<de) return false; if(ate&&(v.data||'')>ate) return false;
    if(soPend){ if(i.consignado) return i.catalogo===lc(i.categoria||'Semijoias').numero; return !i.acertadoEm; }
    return true;})
  .map(({v,i,efetivo})=>{const share=v.valorTotal>0?efetivo/v.valorTotal:0,hj=today(),preco=num(i.preco),repasse=num(i.custo);
    return {thumb:i.thumb||P.find(p=>p.id===i.produtoId)?.thumb||'',produto:i.nome+(i.subcategoria?` (${i.subcategoria})`:'')+(i.tamanho?` · tam. ${i.tamanho}`:''),data:v.data,preco,repasse,
      comissao:r2(preco-repasse),pct:preco>0?Math.round((preco-repasse)/preco*1000)/10:0,modo:i.consignado?'pct':(i.modo||'custo'),cond:condicao(v),
      parcelas:(v.parcelas||[]).map(p=>({n:p.n,de:v.parcelas.length,venc:p.vencimento,valor:r2(num(p.valor)*share),pago:p.pagoEm||'',st:p.pagoEm?'pago':p.vencimento<hj?'vencida':'a vencer'}))};})
  .sort((a,b)=>(a.data||'').localeCompare(b.data||''));
}
const pctTxt=x=>String(x).replace('.',',')+'%';
// vendas guardam o repasse do momento da venda; quando a comissão/custo do cadastro muda, oferece atualizar as vendas ainda não acertadas
function custoAtual(i,pv){pv=pv||PRIV[i.produtoId];if(!pv)return null;
  const modo=pv.modo||(pv.comissao!=null?'pct':'custo');
  if(modo==='pct'&&pv.comissao!=null) return {custo:r2(num(i.preco)*(1-num(pv.comissao)/100)),modo:'pct',comissao:num(pv.comissao)};
  return {custo:num(pv.custo),modo:'custo'};}
function divergentes(pid,pv){
  return itensVendidos(i=>(!pid||i.produtoId===pid)&&!i.acertadoEm&&(!i.consignado||i.catalogo===lc(i.categoria||'Semijoias').numero))
    .map(x=>({...x,novo:custoAtual(x.i,pv)})).filter(x=>x.novo&&Math.abs(x.novo.custo-num(x.i.custo))>0.009);}
async function aplicarCustos(lista){
  const porVenda={};lista.forEach(x=>{(porVenda[x.v.id]=porVenda[x.v.id]||{})[x.idx]=x.novo;});
  const b=writeBatch(db);
  Object.entries(porVenda).forEach(([vid,mp])=>{const v=V.find(x=>x.id===vid);
    const itens=v.itens.map((i,k)=>mp[k]?{...i,custo:mp[k].custo,modo:mp[k].modo,...(mp[k].comissao!=null?{comissao:mp[k].comissao}:{})}:i);
    b.update(doc(db,'vendas',vid),{itens,custoTotal:r2(itens.reduce((a,i)=>a+num(i.custo),0)),atualizadoEm:serverTimestamp()});});
  await b.commit();
}
const pctDe=(preco,custo)=>preco>0?String(Math.round((preco-custo)/preco*1000)/10).replace('.',',')+'%':'—';

      <div class="kpis" style="grid-template-columns:repeat(${modelo==='pct'?3:2},1fr)">
        <div class="kpi"><small>Peças</small><b>${L.length}</b></div>
        ${modelo==='pct'?`<div class="kpi"><small>Valor das peças</small><b>${brl(tv)}</b></div><div class="kpi"><small>Sua comissão</small><b class="pos">${brl(tc)}</b></div>`:''}
        <div class="kpi" ${modelo==='pct'?'style="grid-column:span 3"':''}><small>${modelo==='pct'?'Repassar a '+esc(nome):'Valor a acertar'}</small><b>${brl(tr)}</b></div></div>
      <div class="list">${L.map(x=>`<div class="vbloco" style="margin:0"><div class="hd"><span class="rth" style="background-image:url('${x.thumb}')"></span><div style="min-width:0;flex:1"><b>${esc(x.produto)}</b><div style="color:var(--muted);font-size:.8rem">vendido ${fdate(x.data)}${datas?' · '+esc(x.cond):''}</div></div>
        <div style="text-align:right;flex:none">${modelo==='pct'?`<div>${brl(x.preco)}</div><div style="font-size:.78rem;color:var(--muted)">comissão ${pctTxt(x.pct)} = ${brl(x.comissao)}</div><div style="font-size:.8rem;color:var(--wine)">repasse ${brl(x.repasse)}</div>`
          :`<div style="font-weight:500">${brl(x.repasse)}</div>`}</div></div>${linhaParc(x)}</div>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" id="rfcp">Copiar p/ WhatsApp</button><button class="btn ghost" id="rfcsv">CSV</button><button class="btn ghost" id="rfpr">PDF</button></div>
      <p style="color:var(--muted);font-size:.76rem;margin-top:8px;line-height:1.5">Nenhum dado da cliente é incluído.${datas?' Parcelas proporcionais ao item quando a venda tem mais de um produto.':''}</p>`;
    avisoSemForn($('#rfout'),()=>relatorioFornecedor(nome));
    avisoDivergentes($('#rfout'),()=>relatorioFornecedor(nome));
    if(!L.length) return;
    const titulo=`Vendas · ${nome}${$('#rfde').value||$('#rfate').value?` · ${$('#rfde').value?fdate($('#rfde').value):'início'} a ${$('#rfate').value?fdate($('#rfate').value):'hoje'}`:''}`;
    const parcTxt=x=>datas?`\n${x.cond}: `+x.parcelas.map(p=>`${fdate(p.venc)} ${brl(p.valor)}${p.st==='pago'?' (pago)':''}`).join(' · '):'';
    $('#rfcp').onclick=async()=>{const t=`*${titulo}*\n\n`+L.map((x,k)=>modelo==='pct'
        ?`${k+1}) ${x.produto}\nVendido ${fdate(x.data)} · peça ${brl(x.preco)} · comissão ${pctTxt(x.pct)} (${brl(x.comissao)}) · repasse ${brl(x.repasse)}${parcTxt(x)}`
        :`${k+1}) ${x.produto} · vendido ${fdate(x.data)} · ${brl(x.repasse)}${parcTxt(x)}`).join(modelo==='pct'||datas?'\n\n':'\n')
        +(modelo==='pct'?`\n\nValor das peças: ${brl(tv)}\nComissão: ${brl(tc)}\nRepasse: ${brl(tr)}`:`\n\nTotal a acertar: ${brl(tr)}`);
      try{await navigator.clipboard.writeText(t);toast('Copiado. Cole no WhatsApp');}catch{alert(t);}};
    $('#rfcsv').onclick=()=>{const cab=modelo==='pct'?['Produto','Data venda','Valor peça','Comissão %','Comissão R$','Repasse']:['Produto','Data venda','Valor a acertar'];
      const base=x=>modelo==='pct'?[x.produto,fdate(x.data),x.preco,x.pct,x.comissao,x.repasse]:[x.produto,fdate(x.data),x.repasse];
      dlCSV([datas?[...cab,'Condição','Parcela','Vencimento','Valor parcela','Situação']:cab]
        .concat(datas?L.flatMap(x=>x.parcelas.map(p=>[...base(x),x.cond,`${p.n}/${p.de}`,fdate(p.venc),p.valor,p.st==='pago'?'pago '+fdate(p.pago):p.st])):L.map(base)),`vendas-${nome}-${today()}.csv`);};
    $('#rfpr').onclick=async()=>{
      const b=$('#rfpr');
      if(!window.jspdf?.jsPDF||!window.jspdf.jsPDF.API?.autoTable){b.disabled=true;b.textContent='Preparando…';
        try{await prepPDF();}catch(e){b.disabled=false;b.textContent='PDF';return alert('Não consegui carregar o gerador de PDF. Confira a internet e tente de novo.');}
        // o iOS exige um toque novo para abrir o compartilhamento
        b.disabled=false;b.textContent='Compartilhar PDF';toast('PDF pronto. Toque de novo para compartilhar');return;}
      const head=['Produto','Venda',...(modelo==='pct'?['Valor peça','Comissão','Repasse']:['Valor a acertar']),...(datas?['Pagamento']:[])];
      const body=L.map(x=>[x.produto,fdate(x.data),...(modelo==='pct'?[brl(x.preco),`${pctTxt(x.pct)}\n${brl(x.comissao)}`,brl(x.repasse)]:[brl(x.repasse)]),
        ...(datas?[x.cond+'\n'+x.parcelas.map(p=>`${fdate(p.venc)}  ${brl(p.valor)}${p.st==='pago'?'  (pago)':''}`).join('\n')]:[])]);
      const foot=['Total','',...(modelo==='pct'?[brl(tv),brl(tc),brl(tr)]:[brl(tr)]),...(datas?['']:[])];
      await pdfTabela({imgs:L.map(x=>x.thumb),titulo,sub:`Emitido em ${fdate(today())} · ${L.length} peça${L.length===1?'':'s'}`,head,body,foot,arquivo:`vendas-${nome}-${today()}.pdf`});};
  };
  ['#rfn','#rft','#rfde','#rfate','#rfpend','#rfdt'].forEach(s=>$(s).onchange=draw); draw();
}

function limparOutras(){
  const outros=P.filter(p=>!isLote(p.categoria)), cnt=s=>outros.filter(p=>p.status===s).length;
  open(`<h4>Limpar categorias<button data-x>✕</button></h4>
    <p style="color:var(--muted);line-height:1.55;margin-bottom:14px">Fitness, casual, perfumes, utilidades e eletrônicos: ${cnt('disponivel')} disponíveis, ${cnt('reservado')} reservados, ${cnt('encomenda')} sob encomenda. Os lotes não são afetados.</p>
    <label class="chk"><input type="checkbox" id="wkeep" checked><span>Manter itens reservados</span></label>
    <label class="chk"><input type="checkbox" id="wcsv" checked><span>Baixar lista antes de apagar</span></label>
    <div class="fld" style="margin-top:12px"><label>Digite LIMPAR para confirmar</label><input id="wtxt" autocomplete="off" autocapitalize="characters"></div>
    <p id="wmsg" style="color:var(--muted);font-size:.85rem;margin-bottom:10px"></p>
    <button class="btn red block" id="wgo">Apagar</button>`);
  $('#wgo').onclick=async()=>{
    if($('#wtxt').value.trim().toUpperCase()!=='LIMPAR') return alert('Digite LIMPAR para confirmar.');
    const alvo=outros.filter(p=>!($('#wkeep').checked&&p.status==='reservado'));
    if(!alvo.length) return alert('Nada para apagar.');
    if($('#wcsv').checked) dlCSV([['Produto','Categoria','Fornecedor','Situação','Preço','Custo','Descrição']].concat(outros.map(p=>[p.nome,p.categoria||'',fornDe(p),p.status,num(p.preco),num(PRIV[p.id]?.custo),p.descricao||''])),`catalogo-${today()}.csv`);
    $('#wgo').disabled=true;
    try{await apagarProdutos(alvo,$('#wmsg'));close();toast(`${alvo.length} produtos removidos`);}
    catch(e){console.error(e);alert('Parou no meio: '+e.message+'. Rode de novo para terminar.');$('#wgo').disabled=false;}
  };
}
function verClientes(){
  const lista=Object.values(C).map(c=>{const vs=V.filter(v=>v.clienteWhats===c.whats);
    return {...c,vs,total:vs.reduce((a,v)=>a+v.valorTotal,0),aberto:vs.reduce((a,v)=>a+v.valorTotal-pago(v),0)};})
    .sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR'));
  open(`<h4>Clientes (${lista.length})<button data-x>✕</button></h4>
    <div class="fld"><input id="cq" type="search" placeholder="Buscar por nome ou número"></div>
    <div class="list" id="cl"></div>`);
  const draw=()=>{const q=$('#cq').value.trim().toLowerCase(),qd=q.replace(/\D/g,'');
    $('#cl').innerHTML=lista.filter(c=>!q||(c.nome||'').toLowerCase().includes(q)||(qd&&c.whats.includes(qd))).map(c=>`<div class="vcard">
      <div class="hd"><div style="min-width:0"><div style="font-weight:500">${esc(c.nome)}</div>
        <div style="color:var(--muted);font-size:.8rem">${fmtW(c.whats)} · ${c.vs.length} compra${c.vs.length===1?'':'s'}${c.vs.length?' · '+brl(c.total):''}</div>
        ${c.aberto>0.01?`<div class="wrn" style="font-size:.8rem">em aberto ${brl(c.aberto)}</div>`:''}</div>
        <a class="btn ghost sm" target="_blank" style="text-decoration:none;flex:none;align-self:flex-start" href="${wa(c.whats)}">WhatsApp</a></div>
      ${c.vs.length?`<div class="vitens">${c.vs.flatMap(v=>(v.itens||[]).map(i=>`<div><span class="mini" style="background-image:url('${i.thumb||''}')"></span><span>${itemTxt(i)} <span style="color:var(--muted)">· ${fdate(v.data)}</span></span><span>${brl(i.preco)}</span></div>`)).join('')}</div>`:''}
    </div>`).join('')||'<div class="empty">Nenhum cliente encontrado.</div>';};
  $('#cq').oninput=draw; draw();
}

// ---------- sheet ----------
function open(html){$('#sheet').innerHTML=html;$('#ov').classList.add('on');document.body.style.overflow='hidden';$('#sheet').scrollTop=0;
  $('#sheet').querySelectorAll('[data-x]').forEach(b=>b.onclick=close);}
function close(){$('#ov').classList.remove('on');document.body.style.overflow='';}
$('#ov').onclick=e=>{if(e.target.id==='ov')close();};

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
// o app instalado no iPhone pode ficar "congelado" numa versão antiga: ao abrir/voltar, confere se há versão nova e recarrega
async function checaVersao(){
  try{const t=await (await fetch('sw.js?t='+Date.now(),{cache:'no-store'})).text();const m=t.match(/marilia-adm-v(\d+)/),nv=m?+m[1]:0;
    if(nv>APP_V&&sessionStorage.getItem('reloadV')!==String(nv)){sessionStorage.setItem('reloadV',String(nv));toast('Atualizando o app…');
      try{const r=await navigator.serviceWorker?.getRegistration();await r?.update();}catch{}
      setTimeout(()=>location.reload(),700);}}catch{}
}
checaVersao(); document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checaVersao();});
